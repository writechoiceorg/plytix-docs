        sources: [
          {
            title: 'Integration Guide',
            slug: 'integration-guide',
            content: {"openapi": "3.1.0", "info": {"title": "Integration Guide", "version": "0.1.0", "description": "# Catalog Synchronization Integration Specification\n\n> **Navigation:** this site has three sections \u2014 use the document selector\n> in the **top-left corner** (tap the \u2630 icon first if the sidebar isn't\n> visible) to switch between them. Direct links:\n> [Integration Guide](index.html?doc=integration-guide#integration-guide) \u00b7\n> [External Provider](index.html?doc=external-provider-process#external-provider-process) \u00b7\n> [PIM](index.html?doc=pim#pim).\n\n> Source: *Implementation of Channels by external providers* (v0.1.0).\n> This is the business/integration design spec for how an **External Provider**\n> integrates with Plytix to synchronize a product catalog to a channel. The\n> two OpenAPI documents in this reference implement the contract described\n> here \u2014 see the **External Provider** and **PIM** tabs for the\n> concrete request/response schemas.\n\n> **Note on paths:** this document (and the diagram below) refers to the\n> External Provider endpoints without the `/api` prefix (e.g. `/v1/tasks`).\n> The live implementation documented in the **External Provider**\n> tab mounts them under `/api` (e.g. `/api/v1/tasks`). Endpoint names and\n> semantics are otherwise the same.\n\n## 1. Integration Objective\n\nPlytix is a **Product Information Management (PIM)** platform. Our platform\nallows our clients to create and manage their product catalog, and to have\nthat catalog synchronized with the stores where they sell, which we refer to\nas **channels**.\n\nThe objective of this collaboration is for the **External Provider** to act\nas a synchronization service between the products that exist in the Plytix\nplatform and the store (channel) to which they must be synchronized.\n\n## 2. Communication Architecture\n\nThe integration follows a bidirectional communication model:\n\n1. **Plytix PIM API \u2192 External Provider:** Plytix PIM triggers a\n   synchronization request (`/v1/tasks`), providing the necessary metadata\n   (task IDs, store identifiers, and data resource references).\n2. **External Provider \u2192 Plytix PIM API:** The External Provider reports\n   processing progress and final status updates (e.g., success, error,\n   cancellation) back to the PIM via callback endpoints.\n\nIn Plytix, products are exported using an `ndjson` (newline-delimited JSON)\nfile. Each line of this file represents a single product. Internally, our\nproducts always include an `id`, a `sku`, and optionally a `label`. Product\nattributes arrive already mapped by Plytix to the format expected by the\ndestination channel.\n\nAll products are provided in a single `ndjson` file, accessible through a\nURL that we send to the External Provider. Along with this URL, we also send\nour client's identifier (`account_id`) and a `task_id`, both represented as\nhexadecimal identifiers. The `task_id` allows the External Provider (and\nPlytix) to identify the specific product synchronization job being processed\nfor a given store.\n\nExample of a single line within the `ndjson` file:\n\n```json\n{\"product\": {\"id\": \"6614a1b2c3d4e5f678901234\", \"sku\": \"sku-0001\", \"label\": \"Prod 1\"}, \"errors\": {}}\n```\n\n## 3. Authentication\n\nAuthentication for all calls in this integration is performed using\nauthentication headers. The same mechanism is used both for the requests\nthat the External Provider sends to Plytix and for the requests that Plytix\nsends to the External Provider, but each direction uses a different token.\n\n**Example header:**\n\n```\nAuthorization: Bearer <TOKEN>\n```\n\nPlytix will use a token issued by the External Provider when calling the\nExternal Provider's API, and the External Provider will use a token issued\nby Plytix when calling the Plytix PIM API.\n\n*This authentication mechanism is provisional and may be subject to change.*\n\n## 4. API Contract\n\n### 4.1. Calls to External Provider\n\nPlytix PIM will invoke the following endpoints on the External Provider's\nsystem:\n\n| Method | Endpoint | Description |\n| --- | --- | --- |\n| POST | `/v1/tasks` | Initiates a new synchronization task. |\n| GET | `/v1/tasks/{task_id}` | Retrieves the current status of a specific task. |\n| POST | `/v1/tasks/{task_id}/cancel` | Requests the cancellation of an ongoing task. |\n| GET | `/v1/tasks/{task_id}/process-logs` | Retrieves the paginated process logs for a specific task. |\n\nAll requests use JSON. Use headers indicating the body type and the expected\nresponse:\n\n```\nContent-Type: application/json\nAccept: application/json\n```\n\n**Example Request (`POST /v1/tasks`):**\n\n```json\n{\n  \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n  \"account_id\": \"5f8d0d55b54764421b7156c3\",\n  \"store_id\": \"store_abc\",\n  \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\"\n}\n```\n\n**Request Fields:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `task_id` | Unique identifier for the synchronization task, generated by Plytix. | Required |\n| `account_id` | Identifier of the Plytix client (account) requesting the synchronization. | Required |\n| `store_id` | Identifier of the destination store (channel) to synchronize. | Required |\n| `ndjson_url` | URL where the ndjson file with the products to synchronize can be downloaded. | Required |\n\n**Example Response (`201 Created`):**\n\n```json\n{\n  \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n  \"account_id\": \"5f8d0d55b54764421b7156c3\",\n  \"store_id\": \"store_abc\",\n  \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\",\n  \"state\": null,\n  \"summary\": null,\n  \"started\": null,\n  \"ended\": null\n}\n```\n\n**Example Request (`GET /v1/tasks/{task_id}`) \u2014 no body required.**\n\n**Path Parameters:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `task_id` | Identifier of the task whose status is being requested. | Required |\n\n**Example Response (`200 OK`):**\n\n```json\n{\n  \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n  \"account_id\": \"5f8d0d55b54764421b7156c3\",\n  \"store_id\": \"store_abc\",\n  \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\",\n  \"state\": \"running\",\n  \"summary\": {\n    \"product\": {\n      \"count\": 21,\n      \"success\": 18,\n      \"error\": 2,\n      \"warning\": 1\n    }\n  },\n  \"started\": \"2026-07-30T08:15:19.663166+00:00\",\n  \"ended\": null\n}\n```\n\n**Example Request (`POST /v1/tasks/{task_id}/cancel`) \u2014 no body required.**\n\n**Path Parameters:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `task_id` | Identifier of the task to cancel. | Required |\n\n**Example Response (`200 OK`):**\n\n```json\n{\n  \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n  \"account_id\": \"5f8d0d55b54764421b7156c3\",\n  \"store_id\": \"store_abc\",\n  \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\",\n  \"state\": \"cancelled\",\n  \"summary\": {\n    \"product\": {\n      \"count\": 21,\n      \"success\": 10,\n      \"error\": 1,\n      \"warning\": 0\n    }\n  },\n  \"started\": \"2026-07-30T08:15:19.663166+00:00\",\n  \"ended\": \"2026-07-30T08:16:42.881310+00:00\"\n}\n```\n\n**Example Request (`GET /v1/tasks/{task_id}/process-logs?page={page}&page_size={page_size}`) \u2014 no body required.**\n\n**Path Parameters:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `task_id` | Identifier of the task whose process logs are being requested. | Required |\n\n**Query Parameters:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `page` | Page number to retrieve. Defaults to 1. | Optional |\n| `page_size` | Number of entries per page. | Optional |\n\nNote: the ordering of results must be consistent across pages (e.g., always\nsorted by a stable field) to ensure that paginated requests return the\ncomplete set of results without duplicates or omissions.\n\n**Example Response (`200 OK`):**\n\n```json\n{\n  \"data\": [\n    {\n      \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n      \"account_id\": \"5f8d0d55b54764421b7156c3\",\n      \"data\": {\n        \"id\": \"6614a1b2c3d4e5f678901234\",\n        \"sku\": \"SEED01-CAM-001\",\n        \"label\": \"Basic T-Shirt\"\n      },\n      \"resource_id\": \"6614a1b2c3d4e5f678901234\",\n      \"resource_type\": \"product\",\n      \"resource_result\": \"success\",\n      \"resource_action\": \"update\"\n    },\n    {\n      \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n      \"account_id\": \"5f8d0d55b54764421b7156c3\",\n      \"data\": {\n        \"id\": \"7725b2c3d4e5f6789012345a\",\n        \"sku\": \"SEED02-CAM-002\",\n        \"label\": \"Basic T-Shirt (M)\"\n      },\n      \"resource_id\": \"7725b2c3d4e5f6789012345a\",\n      \"resource_type\": \"product\",\n      \"resource_result\": \"error\",\n      \"resource_action\": \"update\"\n    }\n  ],\n  \"pagination\": {\n    \"page\": 1,\n    \"page_size\": 2,\n    \"total_items\": 2,\n    \"total_pages\": 1,\n    \"items_in_page\": 2\n  }\n}\n```\n\n### 4.2. Calls to Plytix PIM API\n\nThe External Provider is required to invoke the following endpoints on the\nPlytix PIM API to report progress and results:\n\n| Method | Endpoint | Description |\n| --- | --- | --- |\n| POST | `/api/external/process-logs` | Submits processing results (logs) per product. |\n| PATCH | `/api/external/tasks/{task_id}` | Updates the global status of the task. |\n\nRequired Parameters: `account_id` and `task_id` must be included in every\nrequest for data integrity validation.\n\n**Example Request (`POST /api/external/process-logs`):**\n\n```json\n[\n  {\n    \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n    \"account_id\": \"5f8d0d55b54764421b7156c3\",\n    \"data\": {\n      \"id\": \"6614a1b2c3d4e5f678901234\",\n      \"sku\": \"SEED01-CAM-001\",\n      \"label\": \"Basic T-Shirt\"\n    },\n    \"resource_id\": \"6614a1b2c3d4e5f678901234\",\n    \"resource_type\": \"product\",\n    \"resource_action\": \"update\",\n    \"resource_result\": \"success\"\n  },\n  {\n    \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n    \"account_id\": \"5f8d0d55b54764421b7156c3\",\n    \"data\": {\n      \"id\": \"7725b2c3d4e5f6789012345a\",\n      \"sku\": \"SEED02-CAM-002\",\n      \"label\": \"Basic T-Shirt (M)\"\n    },\n    \"resource_id\": \"7725b2c3d4e5f6789012345a\",\n    \"resource_type\": \"product\",\n    \"resource_action\": \"update\",\n    \"resource_result\": \"error\"\n  }\n]\n```\n\nNote: process-logs requests are limited to a maximum of 100 entries per call.\n\n**Request Fields (per entry):**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `task_id` | Identifier of the task this log entry belongs to. | Required |\n| `data.id` | Internal Plytix product identifier. | Required |\n| `data.sku` | Product SKU. Unique. | Required |\n| `data.label` | Human-readable product name. | Optional |\n| `resource_id` | Identifier of the resource (product) being reported. | Required |\n| `resource_type` | Type of resource being reported. Allowed values: `product`, `asset`. | Required |\n| `resource_action` | Action performed on the resource. Allowed values: `create`, `update`, `skip`, `delete`. | Required |\n| `resource_result` | Result of the action. Allowed values: `success`, `error`, `warning`. | Required |\n| `account_id` | Identifier of the Plytix client (account) requesting the synchronization. | Required |\n\n**Example Response (`201 Created`):**\n\n```json\n{\n  \"data\": [\n    {\n      \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n      \"account_id\": \"5f8d0d55b54764421b7156c3\",\n      \"data\": {\n        \"id\": \"6614a1b2c3d4e5f678901234\",\n        \"sku\": \"SEED01-CAM-001\",\n        \"label\": \"Basic T-Shirt\"\n      },\n      \"resource_id\": \"6614a1b2c3d4e5f678901234\",\n      \"resource_type\": \"product\",\n      \"resource_action\": \"update\",\n      \"resource_result\": \"success\"\n    }\n  ],\n  \"errors\": []\n}\n```\n\n**Example Request (`PATCH /api/external/tasks/{task_id}`):**\n\n```json\n{\n  \"account_id\": \"5f8d0d55b54764421b7156c3\",\n  \"state\": \"running\",\n  \"summary\": {\n    \"product\": {\n      \"count\": 21,\n      \"error\": 0,\n      \"success\": 0,\n      \"warning\": 0\n    }\n  },\n  \"messages\": [\n    {\n      \"level\": \"ERROR\",\n      \"message\": \"The task could not be completed due to an error.\"\n    }\n  ],\n  \"started\": \"2026-07-23T14:43:43Z\",\n  \"ended\": \"2026-07-23T16:13:10Z\"\n}\n```\n\nNote: `messages`, `started` and `ended` are optional.\n\n**Request Fields:**\n\n| Field | Description | Required / Optional |\n| --- | --- | --- |\n| `account_id` | Identifier of the Plytix client (account) requesting the synchronization. | Required |\n| `state` | New global status of the task. Allowed values: `created`, `running`, `success`, `failed`, `cancelled`. | Required |\n| `summary.product.count` | Total number of products processed so far. | Required |\n| `summary.product.success` | Number of products synchronized successfully. | Required |\n| `summary.product.error` | Number of products that failed to synchronize. | Required |\n| `summary.product.warning` | Number of products synchronized with warnings. | Required |\n| `messages` | Additional list of messages or details about the processing. | Optional |\n| `started` | Timestamp when the task processing started. | Optional |\n| `ended` | Timestamp when the task processing ended. | Optional |\n\n**Example Response (`200 OK`):**\n\n```json\n{\n  \"data\": {\n    \"id\": \"60c72b2f9b1e8a5a3c8d4567\",\n    \"state\": \"running\",\n    \"messages\": [\n      {\n        \"level\": \"ERROR\",\n        \"message\": \"The task could not be completed due to an error.\"\n      }\n    ],\n    \"started\": \"2026-07-30T07:44:50.607Z\",\n    \"ended\": \"2026-07-30T07:44:50.607Z\"\n  },\n  \"errors\": [\n    {\n      \"name\": \"task_update_error\",\n      \"description\": \"The status could not be changed because the task is already completed.\"\n    }\n  ]\n}\n```\n\n## 5. Happy Path Flow\n\nThe following describes the complete happy path flow for a synchronization\ntask:\n\n1. We call `POST /v1/tasks` on your API to indicate our client, the store,\n   the task id, and the `ndjson` file to download the products to be\n   synchronized.\n2. You must change the task status to `running` using our\n   `PATCH /api/external/tasks/{task_id}` endpoint.\n3. During processing:\n   1. In batches, you must report to us the products that are being updated\n      in the store, indicating which failed and which were synchronized\n      successfully. This will use our `POST /api/external/process-logs`\n      endpoint.\n   2. Before or after each batch update, `PATCH /api/external/tasks/{task_id}`\n      must be called with the summary, which corresponds to the status\n      summary of the products as counters.\n   3. At the same time, on our side, every X minutes we will retrieve the\n      task status by calling the `GET /v1/tasks/{task_id}` endpoint.\n   4. If strictly necessary, we may also call the\n      `GET /v1/tasks/{task_id}/process-logs` endpoint. This is a\n      reconciliation mechanism on our side, not a duplicate of the push in\n      step 3.1: it is a backup pull that lets us verify or recover the\n      complete log history of a task.\n4. Once the task has finished, you must call our service using the\n   `PATCH /api/external/tasks/{task_id}` endpoint with the updated status,\n   using **success** or **failed** as appropriate. **failed** must only be\n   used if an error occurred during execution and the task could not be\n   completed. **success** must be used if the only error was a failure\n   updating individual products.\n5. We will call the `GET /v1/tasks/{task_id}` endpoint again to determine\n   the status of the task and to obtain the updated summary counters with\n   the number of failed and successful products.\n\n![Happy path sequence diagram](./assets/happy-path-flow.png)\n\n## 6. Task Cancellation\n\nOur client can cancel a task whenever they wish, but this is not always\npossible if a race condition occurs: it is possible that the task has\nalready completed by the time the cancellation request is received.\n\n1. If a cancellation is necessary, we will call the\n   `POST /v1/tasks/{task_id}/cancel` endpoint.\n2. Depending on the outcome:\n   1. If the task could be **cancelled** successfully, the `cancelled` state\n      will be sent to our `PATCH /api/external/tasks/{task_id}` endpoint.\n   2. If the task finished with a different state, that state must be used\n      instead, sent to the same endpoint above.\n\n![Task cancellation sequence diagram](./assets/task-cancellation-flow.png)\n\n## 7. Operational Requirements\n\n- **Idempotency:** The External Provider must implement idempotent logic for\n  task creation (`POST /v1/tasks`), keyed by `task_id` \u2014 retrying with the\n  same `task_id` must not create a duplicate task. `process-logs`\n  submissions are intentionally **not** idempotent: retried or duplicated\n  entries will be stored again, as they represent an append-only event log.\n- **Batch Processing:** `process-logs` should be submitted in batches.\n- **State Consistency:** The External Provider must ensure the order of\n  event reporting.\n- **Timeouts and Retries:** The integration should handle 5xx errors with a\n  standard exponential backoff retry policy.\n- **Identifiers:** The `task_id`, generated by Plytix PIM at the start of the\n  process, serves as the unique identifier for all communications.\n\n## 8. Status Code Responses\n\nThe following HTTP status codes must be used to communicate the result of\neach request between Plytix and the External Provider:\n\n- **200 - OK:** The request was processed successfully. Used for standard\n  successful calls that do not create a new resource, such as\n  `GET /v1/tasks/{task_id}` when retrieving the current status of a task.\n- **201 - Created:** The request was processed successfully and a new\n  resource was created. This code must be returned specifically as the\n  response to `POST /v1/tasks`, when a new synchronization task is created.\n- **4xx - Client Error (non-retryable):** Indicates that the request itself\n  is invalid or cannot be fulfilled as sent (e.g. `400 Bad Request` for a\n  malformed payload, `401 Unauthorized` for invalid credentials or\n  `404 Not Found` for an unknown `task_id`). These errors are considered\n  non-recoverable: retrying the same request will not change the outcome,\n  so neither Plytix nor the External Provider should attempt automatic\n  retries. The task must be marked as failed and requires a corrected\n  request or manual intervention.\n- **5xx - Server Error (retryable):** Indicates a failure on the server\n  side rather than in the request itself (e.g. `500 Internal Server Error`,\n  `502 Bad Gateway`, `503 Service Unavailable`, or `504 Gateway Timeout`).\n  These errors are considered recoverable, since the same request may\n  succeed once the issue is resolved. Both Plytix and the External Provider\n  must retry these requests automatically, following the exponential\n  backoff retry policy described in the Operational Requirements section.\n\n## 9. Requirements to be defined\n\n- **Environments** \u2014 define how sandbox vs. production is\n  indicated/configured for the integration.\n- **Data Schema** \u2014 define the exact fields expected per product in the\n  catalog export/resource file (SKU, price, attributes, etc.). The\n  requirements depend on the store to be implemented.\n- **Store Configuration** \u2014 We haven't defined how we initially set up our\n  client's store. Currently, we've defined a `store_id` variable to identify\n  the store.\n- **Retry Policy & Timeouts** \u2014 the specific values (base delay, maximum\n  number of retries, and exact timeout per request) for the exponential\n  backoff retry policy still need to be defined for both directions (Plytix\n  calling the External Provider, and the External Provider calling Plytix).\n", "contact": {"name": "Plytix", "email": "hello@plytix.com"}}, "paths": {}},

            content: {"openapi": "3.1.0", "info": {"title": "External Provider", "description": "The endpoints Plytix PIM calls on an External Provider's system: to hand off a new\nsynchronization task, track its status, request cancellation, and \u2014 if strictly necessary \u2014\npull back its process logs for reconciliation.\n\nSee the Integration Guide for the full contract, authentication, and happy-path flow.", "contact": {"name": "Plytix", "email": "hello@plytix.com"}, "version": "0.1.0", "x-scalar-sdk-installation": [{"lang": "Shell", "description": "Start a sync with `curl`:\n\n```sh\ncurl -X POST https://<external-provider-host>/api/v1/tasks \\\n  -H \"Authorization: Bearer <TOKEN>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n    \"account_id\": \"5f8d0d55b54764421b7156c3\",\n    \"store_id\": \"store_abc\",\n    \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\"\n  }'\n```"}, {"lang": "Python", "description": "Using [`requests`](https://pypi.org/project/requests/):\n\n```python\nimport requests\n\nrequests.post(\n    \"https://<external-provider-host>/api/v1/tasks\",\n    headers={\"Authorization\": \"Bearer <TOKEN>\"},\n    json={\n        \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n        \"account_id\": \"5f8d0d55b54764421b7156c3\",\n        \"store_id\": \"store_abc\",\n        \"ndjson_url\": \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\",\n    },\n).raise_for_status()\n```"}, {"lang": "Node.js", "description": "Using the built-in `fetch`:\n\n```js\nawait fetch(\"https://<external-provider-host>/api/v1/tasks\", {\n  method: \"POST\",\n  headers: {\n    Authorization: \"Bearer <TOKEN>\",\n    \"Content-Type\": \"application/json\",\n  },\n  body: JSON.stringify({\n    task_id: \"60c72b2f9b1e8a5a3c8d4567\",\n    account_id: \"5f8d0d55b54764421b7156c3\",\n    store_id: \"store_abc\",\n    ndjson_url: \"https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson\",\n  }),\n})\n```"}]}, "paths": {"/api/v1/tasks": {"post": {"tags": ["sync"], "summary": "Start a sync", "description": "Create (or upsert) a task and ingest its ndjson file.\n\nStreams `ndjson_url` from S3 line by line and stores one `sync_line` per row. The task\nstarts out `created`; `state`/`summary`/`started`/`ended` are still null at this point.\n\n**Where this fits:** step 1 of *Happy Path Flow* \u2014 Plytix calls this to hand\noff a new synchronization job. **Idempotency:** must be idempotent, keyed by\n`task_id`; retrying with the same `task_id` must not create a duplicate\ntask. See the Integration Guide's *Happy Path Flow* and *Operational\nRequirements* sections.", "operationId": "post_start_sync_api_v1_tasks_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/StartSyncRequest"}}}, "required": true}, "responses": {"201": {"description": "Task created (or updated) and ndjson ingested.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/v1/tasks/{task_id}": {"get": {"tags": ["tasks"], "summary": "Get a task", "description": "Return the task in the shape consumed by PIM. 404 if unknown.\n\n**Where this fits:** polled periodically by Plytix (steps 3.3 and 5 of\n*Happy Path Flow* in the Integration Guide) to read back `state` and the\n`summary` counters.", "operationId": "get_one_task_api_v1_tasks__task_id__get", "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "description": "The task id used in start_sync.", "title": "Task Id"}, "description": "The task id used in start_sync."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskOut"}}}}, "404": {"description": "Not found"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/v1/tasks/{task_id}/cancel": {"post": {"tags": ["tasks"], "summary": "Cancel a task", "description": "Cancel the task: transition it to `cancelled`, reporting the new state to\nPIM. Returns the cancelled task in the same shape as `GET /tasks/{task_id}`;\n404 if unknown.\n\n**Where this fits:** step 1 of *Task Cancellation* in the Integration\nGuide. A race condition is possible \u2014 the task may already have finished\nby the time this arrives, so report whatever the actual final state turned\nout to be, not necessarily `cancelled`.", "operationId": "post_cancel_task_api_v1_tasks__task_id__cancel_post", "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "description": "The task id used in start_sync.", "title": "Task Id"}, "description": "The task id used in start_sync."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskOut"}}}}, "404": {"description": "Not found"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/v1/tasks/{task_id}/process-logs": {"get": {"tags": ["tasks"], "summary": "List a task's process-logs", "description": "Return the task's lines shaped like the process-logs entries sent to PIM.\n\nOrdered by line number, paginated. 404 if the task is unknown.\n\n**Where this fits:** step 3.4 of *Happy Path Flow* in the Integration\nGuide \u2014 a reconciliation mechanism, not a duplicate of the push in step\n3.1. Plytix uses this as a backup pull to verify or recover the complete\nlog history of a task, called only if strictly necessary. Lists every\nline of the task \u2014 sent or not \u2014 shaped exactly like the process-logs\nbatch entries the External Provider reports back to PIM (see the PIM\ntab's `process-logs` endpoint).", "operationId": "get_task_process_logs_api_v1_tasks__task_id__process_logs_get", "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "description": "The task id used in start_sync.", "title": "Task Id"}, "description": "The task id used in start_sync."}, {"name": "page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "description": "Page number (1-based).", "default": 1, "title": "Page"}, "description": "Page number (1-based)."}, {"name": "page_size", "in": "query", "required": false, "schema": {"type": "integer", "maximum": 1000, "minimum": 1, "description": "Rows per page.", "default": 100, "title": "Page Size"}, "description": "Rows per page."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProcessLogsPageOut"}}}}, "404": {"description": "Not found"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}}, "components": {"schemas": {"HTTPValidationError": {"properties": {"detail": {"items": {"$ref": "#/components/schemas/ValidationError"}, "type": "array", "title": "Detail"}}, "type": "object", "title": "HTTPValidationError"}, "PaginationOut": {"properties": {"page": {"type": "integer", "title": "Page", "description": "Requested page number (1-based)."}, "page_size": {"type": "integer", "title": "Page Size", "description": "Requested rows per page."}, "total_items": {"type": "integer", "title": "Total Items", "description": "Total lines stored for the task, across all pages."}, "total_pages": {"type": "integer", "title": "Total Pages", "description": "Total number of pages given `page_size`."}, "items_in_page": {"type": "integer", "title": "Items In Page", "description": "Number of items actually returned in this page."}}, "type": "object", "required": ["page", "page_size", "total_items", "total_pages", "items_in_page"], "title": "PaginationOut", "description": "Pagination metadata accompanying a paginated listing."}, "ProcessLogEntryOut": {"properties": {"task_id": {"type": "string", "title": "Task Id"}, "account_id": {"type": "string", "title": "Account Id", "description": "Account the task belongs to."}, "data": {"additionalProperties": true, "type": "object", "title": "Data", "description": "`{id, sku, label}` for the line."}, "resource_id": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Resource Id"}, "resource_type": {"$ref": "#/components/schemas/ResourceType", "default": "product"}, "resource_result": {"anyOf": [{"$ref": "#/components/schemas/ResourceResult"}, {"type": "null"}], "description": "null while pending."}, "resource_action": {"$ref": "#/components/schemas/ResourceAction"}}, "type": "object", "required": ["task_id", "account_id", "resource_action"], "title": "ProcessLogEntryOut", "description": "One line shaped like a process-logs entry sent to PIM."}, "ProcessLogsPageOut": {"properties": {"data": {"items": {"$ref": "#/components/schemas/ProcessLogEntryOut"}, "type": "array", "title": "Data"}, "pagination": {"$ref": "#/components/schemas/PaginationOut"}}, "type": "object", "required": ["data", "pagination"], "title": "ProcessLogsPageOut", "description": "A page of a task's lines in PIM format."}, "ResourceAction": {"type": "string", "enum": ["create", "update", "skip", "delete"], "title": "ResourceAction"}, "ResourceResult": {"type": "string", "enum": ["success", "error", "warning"], "title": "ResourceResult"}, "ResourceType": {"type": "string", "enum": ["product", "asset"], "title": "ResourceType"}, "StartSyncRequest": {"properties": {"task_id": {"type": "string", "title": "Task Id", "description": "Task id assigned by PIM (unique).", "examples": ["60c72b2f9b1e8a5a3c8d4567"]}, "account_id": {"type": "string", "title": "Account Id", "description": "Account the task belongs to.", "examples": ["5f8d0d55b54764421b7156c3"]}, "store_id": {"type": "string", "title": "Store Id", "description": "Store the sync targets.", "examples": ["store_abc"]}, "ndjson_url": {"type": "string", "title": "Ndjson Url", "description": "Presigned HTTP(S) URL of the ndjson file to ingest.", "examples": ["https://storage.example.com/exports/60c72b2f9b1e8a5a3c8d4567.ndjson"]}}, "type": "object", "required": ["task_id", "account_id", "store_id", "ndjson_url"], "title": "StartSyncRequest", "description": "Payload to start a sync: the task to create and the ndjson to ingest."}, "TaskOut": {"properties": {"task_id": {"type": "string", "title": "Task Id"}, "account_id": {"type": "string", "title": "Account Id"}, "store_id": {"type": "string", "title": "Store Id"}, "ndjson_url": {"type": "string", "title": "Ndjson Url"}, "state": {"anyOf": [{"$ref": "#/components/schemas/TaskState"}, {"type": "null"}], "description": "null while the task is still `created`."}, "summary": {"anyOf": [{"additionalProperties": true, "type": "object"}, {"type": "null"}], "title": "Summary", "description": "Per-resource-type counts by result, e.g. `{'product': {'count': 21, 'success': 21, 'error': 0, 'warning': 0}}`. Null while the task is still `created`."}, "started": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Started", "description": "When the task started running. null until then."}, "ended": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Ended", "description": "When the task reached a terminal state. null until then."}}, "type": "object", "required": ["task_id", "account_id", "store_id", "ndjson_url"], "title": "TaskOut", "description": "Task representation shared by `POST /tasks`, `GET /tasks/{task_id}`, and cancel.\n\n`state` and `summary` are null until the task leaves `created` \u2014 nothing to report yet.\n`started`/`ended` are null until the task actually starts running / reaches a terminal state."}, "TaskState": {"type": "string", "enum": ["created", "running", "success", "failed", "cancelled"], "title": "TaskState"}, "ValidationError": {"properties": {"loc": {"items": {"anyOf": [{"type": "string"}, {"type": "integer"}]}, "type": "array", "title": "Location"}, "msg": {"type": "string", "title": "Message"}, "type": {"type": "string", "title": "Error Type"}, "input": {"title": "Input"}, "ctx": {"type": "object", "title": "Context"}}, "type": "object", "required": ["loc", "msg", "type"], "title": "ValidationError"}}}, "tags": [{"name": "sync", "description": "Start a sync by ingesting an ndjson file from S3."}, {"name": "tasks", "description": "Query tasks and lines, change task state, mark lines processed, and report results back to PIM."}]},

          {
            title: 'PIM',
            slug: 'pim',
            content: {"openapi": "3.1.0", "info": {"title": "PIM", "version": "0.1.0", "contact": {"name": "Plytix", "email": "hello@plytix.com"}, "x-scalar-sdk-installation": [{"lang": "Shell", "description": "Report a processed product with `curl`:\n\n```sh\ncurl -X POST https://<pim-host>/api/external/process-logs \\\n  -H \"Authorization: Bearer <TOKEN>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '[{\n    \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n    \"account_id\": \"5f8d0d55b54764421b7156c3\",\n    \"data\": {\"id\": \"6614a1b2c3d4e5f678901234\", \"sku\": \"SEED01-CAM-001\"},\n    \"resource_id\": \"6614a1b2c3d4e5f678901234\",\n    \"resource_type\": \"product\",\n    \"resource_action\": \"update\",\n    \"resource_result\": \"success\"\n  }]'\n```"}, {"lang": "Python", "description": "Using [`requests`](https://pypi.org/project/requests/):\n\n```python\nimport requests\n\nrequests.post(\n    \"https://<pim-host>/api/external/process-logs\",\n    headers={\"Authorization\": \"Bearer <TOKEN>\"},\n    json=[{\n        \"task_id\": \"60c72b2f9b1e8a5a3c8d4567\",\n        \"account_id\": \"5f8d0d55b54764421b7156c3\",\n        \"data\": {\"id\": \"6614a1b2c3d4e5f678901234\", \"sku\": \"SEED01-CAM-001\"},\n        \"resource_id\": \"6614a1b2c3d4e5f678901234\",\n        \"resource_type\": \"product\",\n        \"resource_action\": \"update\",\n        \"resource_result\": \"success\",\n    }],\n).raise_for_status()\n```"}, {"lang": "Node.js", "description": "Using the built-in `fetch`:\n\n```js\nawait fetch(\"https://<pim-host>/api/external/process-logs\", {\n  method: \"POST\",\n  headers: {\n    Authorization: \"Bearer <TOKEN>\",\n    \"Content-Type\": \"application/json\",\n  },\n  body: JSON.stringify([{\n    task_id: \"60c72b2f9b1e8a5a3c8d4567\",\n    account_id: \"5f8d0d55b54764421b7156c3\",\n    data: { id: \"6614a1b2c3d4e5f678901234\", sku: \"SEED01-CAM-001\" },\n    resource_id: \"6614a1b2c3d4e5f678901234\",\n    resource_type: \"product\",\n    resource_action: \"update\",\n    resource_result: \"success\",\n  }]),\n})\n```"}]}, "paths": {"/api/external/process-logs": {"post": {"tags": ["process-logs"], "summary": "Create Process Log", "operationId": "create_process_log_api_external_process_logs_post", "requestBody": {"content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/ProcessLogDTO"}, "type": "array", "maxItems": 100, "title": "Body"}}}, "required": true}, "responses": {"201": {"description": "Process Logs created successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProcessLogsResponse"}}}}, "422": {"description": "Invalid request body", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExternalErrorsResponse"}}}}, "500": {"description": "Internal server error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}, "description": "Submit processing results (logs) per product, reported by the External\nProvider back to Plytix.\n\n**Batching:** limited to a maximum of 100 entries per call \u2014 submit in\nbatches.\n\n**Idempotency:** intentionally **not** idempotent. Retried or duplicated\nentries are stored again, since this represents an append-only event log.\n\n**Where this fits:** step 3.1 of *Happy Path Flow* in the Integration\nGuide."}}, "/api/external/tasks/{external_task_id}": {"patch": {"tags": ["tasks"], "summary": "Update Tasks", "operationId": "update_tasks_api_external_tasks__external_task_id__patch", "parameters": [{"name": "external_task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "External Task Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExternalTaskUpdateDTO"}}}}, "responses": {"200": {"description": "Task updated successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExternalTaskResponse"}}}}, "422": {"description": "Invalid state provided", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExternalErrorsResponse"}}}}, "500": {"description": "Internal server error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}, "description": "Update the global status of a task: state, progress summary, and optional\nmessages/timestamps, reported by the External Provider back to Plytix.\n\n**Allowed `state` values:** `created`, `running`, `success`, `failed`,\n`cancelled`. Use `failed` only if the task could not be completed; use\n`success` even if some individual products failed.\n\n**Where this fits:** steps 2, 3.2 and 4 of *Happy Path Flow*, and step 2 of\n*Task Cancellation*, in the Integration Guide."}}}, "components": {"schemas": {"ErrorResponse": {"properties": {"detail": {"type": "string", "title": "Detail"}}, "type": "object", "required": ["detail"], "title": "ErrorResponse"}, "ExternalErrorDTO": {"properties": {"name": {"type": "string", "title": "Name"}, "description": {"type": "string", "title": "Description"}}, "type": "object", "required": ["name", "description"], "title": "ExternalErrorDTO", "description": "Error reported by the external API."}, "ExternalErrorsResponse": {"properties": {"data": {"type": "null", "title": "Data"}, "errors": {"items": {"$ref": "#/components/schemas/ExternalErrorDTO"}, "type": "array", "title": "Errors"}}, "type": "object", "required": ["errors"], "title": "ExternalErrorsResponse", "description": "Response of a request rejected before reaching the service."}, "ExternalTaskDTO": {"properties": {"id": {"type": "string", "title": "Id"}, "state": {"type": "string", "title": "State"}, "messages": {"items": {"anyOf": [{"$ref": "#/components/schemas/ExternalTaskMessageDTO"}, {"additionalProperties": true, "type": "object"}]}, "type": "array", "title": "Messages", "default": []}, "started": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Started"}, "ended": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Ended"}}, "type": "object", "required": ["id", "state"], "title": "ExternalTaskDTO"}, "ExternalTaskMessageDTO": {"properties": {"level": {"$ref": "#/components/schemas/MessageLevel"}, "message": {"type": "string", "title": "Message"}}, "type": "object", "required": ["level", "message"], "title": "ExternalTaskMessageDTO", "description": "Message reported by the external provider that runs the task."}, "ExternalTaskResponse": {"properties": {"data": {"$ref": "#/components/schemas/ExternalTaskDTO"}, "errors": {"items": {"$ref": "#/components/schemas/ExternalErrorDTO"}, "type": "array", "title": "Errors"}}, "type": "object", "required": ["data"], "title": "ExternalTaskResponse", "description": "Task as it is left by the update."}, "ExternalTaskSummaryDTO": {"properties": {"count": {"type": "integer", "title": "Count", "default": 0}, "error": {"type": "integer", "title": "Error", "default": 0}, "success": {"type": "integer", "title": "Success", "default": 0}, "warning": {"type": "integer", "title": "Warning", "default": 0}}, "additionalProperties": true, "type": "object", "title": "ExternalTaskSummaryDTO", "description": "Counters reported for a single resource type.\n\n``count`` is the total number of items to process and the other fields are the items\nalready resolved with that result, which is what the process progress is computed from."}, "ExternalTaskUpdateDTO": {"properties": {"account_id": {"type": "string", "title": "Account Id", "description": "Account identifier that owns the task."}, "state": {"anyOf": [{"$ref": "#/components/schemas/TaskState"}, {"type": "null"}], "description": "New state of the task. Only running and final states are accepted."}, "summary": {"anyOf": [{"additionalProperties": {"$ref": "#/components/schemas/ExternalTaskSummaryDTO"}, "type": "object"}, {"type": "null"}], "title": "Summary", "description": "Counters of the process, keyed by resource type."}, "messages": {"items": {"$ref": "#/components/schemas/ExternalTaskMessageDTO"}, "type": "array", "title": "Messages"}, "started": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Started", "description": "When the provider started the task. Defaults to now when the state is running."}, "ended": {"anyOf": [{"type": "string", "format": "date-time"}, {"type": "null"}], "title": "Ended", "description": "When the provider finished the task. Defaults to now when the state is final."}}, "type": "object", "required": ["account_id"], "title": "ExternalTaskUpdateDTO", "description": "Progress reported by the external provider that runs the task."}, "MessageLevel": {"type": "string", "enum": ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"], "title": "MessageLevel", "description": "Level of a message, named after the standard logging levels."}, "ProcessLogDTO": {"properties": {"account_id": {"type": "string", "title": "Account Id"}, "data": {"additionalProperties": true, "type": "object", "title": "Data"}, "task_id": {"type": "string", "title": "Task Id"}, "resource_id": {"type": "string", "title": "Resource Id"}, "resource_result": {"$ref": "#/components/schemas/ResourceResult"}, "resource_type": {"$ref": "#/components/schemas/ResourceType"}, "resource_action": {"$ref": "#/components/schemas/ResourceAction"}}, "type": "object", "required": ["account_id", "data", "task_id", "resource_id", "resource_result", "resource_type", "resource_action"], "title": "ProcessLogDTO"}, "ProcessLogErrorDTO": {"properties": {"item": {"additionalProperties": true, "type": "object", "title": "Item"}, "error": {"type": "string", "title": "Error"}}, "type": "object", "required": ["item", "error"], "title": "ProcessLogErrorDTO", "description": "Process log of the request that could not be created."}, "ProcessLogsResponse": {"properties": {"data": {"items": {"$ref": "#/components/schemas/ProcessLogDTO"}, "type": "array", "title": "Data"}, "errors": {"items": {"$ref": "#/components/schemas/ProcessLogErrorDTO"}, "type": "array", "title": "Errors"}}, "type": "object", "required": ["data", "errors"], "title": "ProcessLogsResponse", "description": "Process logs created by the request, and the ones that could not be created."}, "ResourceAction": {"type": "string", "enum": ["create", "update", "skip", "delete"], "title": "ResourceAction"}, "ResourceResult": {"type": "string", "enum": ["success", "error", "warning"], "title": "ResourceResult"}, "ResourceType": {"type": "string", "enum": ["product", "asset"], "title": "ResourceType", "description": "These are the only resource types relevant to the External Provider contract."}, "TaskState": {"type": "string", "enum": ["created", "running", "success", "failed", "cancelled"], "title": "TaskState", "description": "This is the complete set of states an External Provider is expected to send or receive."}}}},
          },
        ],
      })

      // The "Deploy" header button has no stable CSS hook to hide via
      // customCss, so remove it once it shows up in the DOM.
      const hideDeployButton = () => {
        const button = Array.from(document.querySelectorAll('button')).find(
          (el) => el.textContent.trim() === 'Deploy',
        )
        if (button) {
          button.remove()
          return true
        }
        return false
      }
      const deployObserver = new MutationObserver(() => {
        if (hideDeployButton()) deployObserver.disconnect()
      })
      deployObserver.observe(document.body, { childList: true, subtree: true })

      // Track which document is active (via the URL hash Scalar uses for
      // routing) so customCss above can hide guide-only chrome. Scalar's
      // in-app document switcher (top-left dropdown) changes the hash via
      // history.pushState/replaceState, which does NOT fire 'hashchange' —
      // so that event alone misses every in-app switch and only catches
      // real browser navigation (reload, back/forward). Patch both to
      // stay in sync regardless of how the hash changed.
      const syncActiveDocumentClass = () => {
        const onGuide = location.hash === '' || location.hash.startsWith('#integration-guide')
        document.body.classList.toggle('on-integration-guide', onGuide)
      }
      ;['pushState', 'replaceState'].forEach((method) => {
        const original = history[method]
        history[method] = function (...args) {
          const result = original.apply(this, args)
          syncActiveDocumentClass()
          return result
        }
      })
      window.addEventListener('hashchange', syncActiveDocumentClass)
      window.addEventListener('popstate', syncActiveDocumentClass)
      syncActiveDocumentClass()
    </script>
  </body>

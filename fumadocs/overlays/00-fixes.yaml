  - target: $.paths['/api/v3/products/{identifier}/{path}'].post
    description: 'POST /api/v3/products/{identifier}/{path} declares no request body; linking a record takes {"id": "<id>"} (Q#94, Q#105). This schema covers link collections only; POST on an attribute path is untested (VERIFY.md).'
    x-plytix-question: OAS-10
    update:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: IdLinkInput
              required:
                - id
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: ID of the record to link.
            examples:
              category:
                summary: Link a category
                value:
                  id: 6a1f0c2e9b3d4a5f8c7e1c02
  - target: $.paths['/api/v3/products/{identifier}/{path}'].patch
    description: PATCH /api/v3/products/{identifier}/{path} declares no request body; it takes the field value on its own (Q#87, FB-020).
    x-plytix-question: OAS-10
    update:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The new value on its own. Its type depends on the attribute.
            examples:
              text:
                summary: Text attribute
                value: Canvas
              decimal:
                summary: Decimal attribute (sent as a string)
                value: "12.5"
              multiSelect:
                summary: Multi-select attribute
                value:
                  - Cotton
              clear:
                summary: Remove a Text value
                value: null
  - target: $.paths['/api/v3/assets/{identifier}/{path}'].patch
    description: PATCH /api/v3/assets/{identifier}/{path} declares no request body; it takes the new value of one field on its own (Q#29, Asset Subpaths.bru 2026-09-08, ASSET-4).
    x-plytix-question: OAS-10, ASSET-23
    update:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: The new value of the field named in `path`, for example `alt_text`, sent on its own, not wrapped in an object.
            examples:
              altText:
                summary: New alt text (path `alt_text`)
                value: Canvas backpack, front view

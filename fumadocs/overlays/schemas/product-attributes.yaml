# Schema edits for the product-attributes endpoints.
# Phase 3 (2026-10-20): create bodies (one titled oneOf branch per type, since
# fumadocs-openapi names tabs after titles and ignores the discriminator), the
# update body (replaces the migrated docstring), output DTO titles, enums.
# Sources: spec 2026-10-02, Q#25a, Q#30, Q#47, Q#66, Q#104, Q#109, Q#110, FB-032,
# bruno-collection/06-Product-Attributes/. Generated once from a script; edit by hand from here on.
overlay: 1.0.0
info:
  title: product-attributes schemas
  version: 1.0.0
actions:
  - target: $.components.schemas.TextAttributeCreateInputDto
    update:
      title: Text
      description: Set `type` to `TextAttribute`. Holds text. Set `character_limit` to cap its length.
  - target: $.components.schemas.TextAttributeCreateInputDto.properties.name
    description: Q#25a
    update:
      description: "Display name of the attribute. It must be unique in your account: a name that already exists returns `409`."
      examples:
        - Collection
  - target: $.components.schemas.TextAttributeCreateInputDto.properties.label
    description: Q#30, Q#66, Q#109, FB-032, Create Text Attribute.bru (label defaulting)
    update:
      description: Key of the attribute in each product's `attributes` map and in filters (`attributes.<label>`). Lowercase letters, digits, and underscores only, up to 255 characters; anything else returns `422`. It can't be changed after creation. If you leave it out, it's set from `name`, which works only when `name` already matches this pattern.
      examples:
        - collection
  - target: $.components.schemas.TextAttributeCreateInputDto.properties.description
    update:
      description: Description of the attribute, up to 200 characters.
  - target: $.components.schemas.TextAttributeCreateInputDto.properties.type
    description: spec discriminator; ProductAttributeUpdateInputDto docstring
    update:
      description: Attribute type. Must be `TextAttribute` for this body, and can't be changed later.
  - target: $.components.schemas.TextAttributeCreateInputDto.properties.character_limit
    update:
      description: Maximum number of characters a value can hold. At least `10`.
      examples:
        - 250
  - target: $.components.schemas.BooleanAttributeCreateInputDto

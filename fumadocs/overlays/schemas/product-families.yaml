# Schema edits for the product-families endpoints (create and update bodies).
# The migrated 2026-10-20 description of ProductFamilyUpdateInputDto (internal
# implementation notes from the upstream docstring) is replaced with reader-facing
# text; its substance (name only, attribute changes propagate) is kept.
# Sources: spec 2026-10-02 constraints, Q#60, Q#72, Q#73, status-gating #4,
# Create Product Family.bru (2026-09-15/22), GEN-1.
overlay: 1.0.0
info:
  title: product-families schemas
  version: 1.0.0
actions:
  # --- create body ---------------------------------------------------------------
  - target: $.components.schemas.ProductFamilyCreateInputDto
    description: Spec (additionalProperties false); 16 Oct 2026 handoff (families are created with a name, attributes are linked through family attributes)
    update:
      description: Body for creating a product family. `name` is the only field. To add attributes to the family, use [Link an attribute to a product family](/reference/v3/family-attributes/add-attribute-to-family) after you create it.

  - target: $.components.schemas.ProductFamilyCreateInputDto.properties.name
    description: Spec maxLength 300; 409 on duplicate (Create Product Family.bru, GEN-1)
    update:
      description: Name of the product family, 1 to 300 characters. It must be unique in your account. A name that already exists returns `409`.
      examples:
        - Mugs

  # --- fields Plytix's 16 Oct 2026 handoff excludes from the public model -----------
  # Create input: attributes, parent_attributes and variant_attributes are excluded
  # (attributes are assigned through family_attributes), so AttributeRefInputDto,
  # used only by them, goes too. Output: account and counters. The live API still
  # accepts and returns them (QUESTIONS.md OAS-26). 2026-10-22.
  - target: $.components.schemas.ProductFamilyCreateInputDto.properties.attributes
    remove: true
  - target: $.components.schemas.ProductFamilyCreateInputDto.properties.parent_attributes
    remove: true
  - target: $.components.schemas.ProductFamilyCreateInputDto.properties.variant_attributes
    remove: true
  - target: $.components.schemas.AttributeRefInputDto
    remove: true
  - target: $.components.schemas.ProductFamilyOutputDto.properties.total_products
    remove: true
  - target: $.components.schemas.ProductFamilyOutputDto.properties.total_attributes
    remove: true
  - target: $.components.schemas.ProductFamilyOutputDto.properties.total_models
    remove: true
  - target: $.components.schemas.ProductFamilyCreateOutputDto.properties.total_products
    remove: true
  - target: $.components.schemas.ProductFamilyCreateOutputDto.properties.total_attributes
    remove: true
  - target: $.components.schemas.ProductFamilyCreateOutputDto.properties.total_models
    remove: true
  # --- output: family_attributes (16 Oct handoff: expandable with _fields) ----------
  - target: $.components.schemas.ProductFamilyOutputDto.properties.family_attributes
    description: 16 Oct handoff (expandable); spec "_fields=family_attributes.*"; never tested live (FAM-23, VERIFY.md)
    update:
      description: The family's attribute links, each with the attribute and its `level`. Returned only when you name `family_attributes` in `_fields`. To list them on their own, use [List a product family's attributes](/reference/v3/family-attributes/list-family-attributes).

  # --- update body ---------------------------------------------------------------
  - target: $.components.schemas.ProductFamilyUpdateInputDto
    description: Replaces the migrated upstream docstring. Q#60, spec (name only, additionalProperties false)
    update:
      description: Fields to change. `name` is the only field you can change. Attribute fields return `422`, because changing which attributes belong to a family affects every product in it. Link and unlink attributes through the family attribute endpoints instead.

  - target: $.components.schemas.ProductFamilyUpdateInputDto.properties.name
    description: Spec maxLength 300
    update:
      description: New name of the product family, 1 to 300 characters.
      examples:
        - Mugs and Cups

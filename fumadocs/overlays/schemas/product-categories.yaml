# Schema edits for the product-categories endpoints (Phase 3, 2026-10-20).
# Sources: spec 2026-10-02 (required fields, additionalProperties false),
# bruno-collection/03-Product-Categories/ (path, slug, n_children behavior, 2026-09-07/22).
# CategoryBaseOutputDto is shared with asset categories, so it isn't edited here.
overlay: 1.0.0
info:
  title: product-categories schemas
  version: 1.0.0
actions:
  # --- create body ---------------------------------------------------------------
  - target: $.components.schemas.ProductCategoryCreateInputDto
    update:
      description: Body for creating a product category. Only `name` is required, and fields not listed here return `422`.
  - target: $.components.schemas.ProductCategoryCreateInputDto.properties.name
    update:
      description: Category name. Plytix builds the category's `slug` from it.
      examples:
        - Backpacks
  - target: $.components.schemas.ProductCategoryCreateInputDto.properties.parent_id
    update:
      description: ID of the category to create this one under. Leave it out to create a top-level category.
      examples:
        - 6a1f0c2e9b3d4a5f8c7e1c01

  # --- update body ---------------------------------------------------------------
  - target: $.components.schemas.ProductCategoryUpdateInputDto
    update:
      description: Fields to change. Send only the fields you want to change, and fields not listed here return `422`.
  - target: $.components.schemas.ProductCategoryUpdateInputDto.properties.name
    update:
      description: New category name. The category's `slug` and the last name in its `path` change with it.
      examples:
        - Travel Backpacks
  - target: $.components.schemas.ProductCategoryUpdateInputDto.properties.parent_id
    update:
      description: ID of the category to move this one under. The category's `path` changes to the new chain of names.
      examples:
        - 6a1f0c2e9b3d4a5f8c7e1c01

  # --- read model (search and get) -------------------------------------------------
  - target: $.components.schemas.ProductCategoryGetOutputDto.properties.parent_id
    update:
      description: ID of the category directly above this one. `null` on a top-level category from a get by ID. Search results and create responses leave the key out for a top-level category.
  - target: $.components.schemas.ProductCategoryCreateOutputDto
    update:
      description: The new category. `created`, `modified`, and, on a top-level category, `parent_id` aren't returned. Read the category back to get them.
  - target: $.components.schemas.ProductCategoryGetOutputDto.properties.path
    update:
      description: Names from the top of the tree down to this category, ending with its own name.
      examples:
        - - Bags
          - Backpacks
  - target: $.components.schemas.ProductCategoryGetOutputDto.properties.slug
    update:
      description: URL-friendly version of the name, generated by Plytix, such as `backpacks`.
  - target: $.components.schemas.ProductCategoryGetOutputDto.properties.n_children
    update:
      description: Number of categories directly below this one.

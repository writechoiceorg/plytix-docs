  # --- relations you can expand with _fields (16 Oct handoff; untested, VERIFY.md) ----
  - target: $.components.schemas.AssetOutputDto.properties.categories
    update:
      description: The asset categories the asset belongs to, as full category records. Returned only when you name `categories` in `_fields`.

# Operation edits for the relationships endpoints: relationship TYPES such as
# "Accessories". Links between products under a type are the product-relationships
# resource (mostly on hold, REL-2); link only to its published pages.
#
# Phase 3 (2026-10-20). Sources: config/api-testing.config.md (Q#60, Q#74,
# Q#84, Q#91, Q#113, Q#116), bruno-collection/14-Relationships/ (captures
# 2026-09-15 to 2026-09-22), the data model guide (intent).
#
# - PATCH success is documented as 204 from the spec plus Q#84/Q#116; the only
#   relationship capture (2026-09-15) predates that change and shows 200 (VERIFY.md).
# - The field routes were never tested except the GET discovery 400; PATCH and
#   DELETE field routes redirect only.
# - account_id is left out of examples (sanitization rule).
overlay: 1.0.0
info:
  title: relationships operations
  version: 1.0.0
actions:
  # --- GET /api/v3/relationships ------------------------------------------------
  - target: $.paths['/api/v3/relationships'].get
    description: Q#74 (_fields, _sort_by, paging, status filter together), Q#91, Q#113 (relationship_label on products), List Relationships.bru (2026-09-21/22)
    update:
      summary: Search relationships
      operationId: search-relationships
      description: |-
        Returns the relationship types in your account, such as "Accessories" or "Cross-sell", one page at a time. A relationship type names a kind of connection between products. It doesn't hold the product links themselves.

        Each record holds the type's `id`, its `name`, its `label`, and its `status`. A product's `product_relationships` field names each type it uses by `relationship_id` and `relationship_label`, which match `id` and `label` here. A label doesn't always match the name: in the first example below, the type named "Cross-sell" has the label `related_products`.

        Filters use the same syntax as every V3 search, for example `status=ACTIVE`. To sort by name, send `_sort_by=name`.

        To see which products are linked under each type, use [Search product relationships](/docs/reference/v3/productrelationships/search-product-relationships). To get the products on the other end of one product's links, use [Search related products](/docs/reference/v3/relatedproducts/search-related-products) with `product_id=<id>`.

        Related pages:

        - [The Plytix data model](/docs/guides/data-model#relationships)
        - [Filtering and query syntax](/docs/reference/v3/filtering-query-syntax)
        - [Pagination](/docs/reference/v3/pagination)

  - target: $.paths['/api/v3/relationships'].get.parameters[?(@.name=='_fields' && @.in=='query')]
    description: List Relationships.bru "200 - Full Parameters" (2026-09-22, all six fields)
    update:
      description: Fields to return for each relationship type, from `id`, `name`, `label`, `status`, `created`, and `modified`. Repeat the parameter once per field, for example `_fields=id&_fields=label`. Leave it out to get every field.

  - target: $.paths['/api/v3/relationships'].get.responses['200'].content['application/json']
    description: List Relationships.bru "200 - Success" (2026-09-21) and "200 - Full Parameters" (2026-09-22), sanitized, names/labels replaced with placeholders, account_id omitted
    update:
      examples:
        all:
          summary: Every relationship type, one page
          description: '`GET /api/v3/relationships`. All results fit on one page, so `pagination` is empty.'
          value:
            x-example-file: relationships/search-200-all.json
        filtered:
          summary: Filter, sort, and page
          description: '`GET /api/v3/relationships?status=ACTIVE&_fields=id&_fields=name&_fields=label&_sort_by=name&_page_size=1`. Only `next_page` is present.'
          value:
            data:
              - id: 6a1f0c2e9b3d4a5f8c7e1f01
                name: Accessories
                label: accessories
            errors: []
            pagination:
              next_page: http://<api-host>/api/v3/relationships?_fields=id&_fields=name&_fields=label&_sort_by=name&_page=2&_page_size=1&status=ACTIVE

  # --- POST /api/v3/relationships ------------------------------------------------
  - target: $.paths['/api/v3/relationships'].post
    description: 'Q#60, Q#117, Create Relationship.bru (2026-09-15; label derived from name, status ACTIVE, 409 on duplicate), GEN-1, spec RelationshipCreateInputDto (additionalProperties false)'
    update:
      summary: Create a relationship
      operationId: create-relationship
      description: |-
        Creates a relationship type, such as "Spare Parts", and returns it, including its new `id`. `name` is the only field in the body.

        Plytix sets the other fields for you:

        - `label` is derived from the name in snake_case, so "Spare Parts" gets `spare_parts`. It doesn't change if you rename the type later.
        - `status` starts as `ACTIVE`.

        Names are unique in your account. If a relationship type with that name already exists, the request returns `409` and creates nothing.

        Creating a type doesn't link any products. To see which products use a type, use [Search product relationships](/docs/reference/v3/productrelationships/search-product-relationships). See [The Plytix data model](/docs/guides/data-model#relationships) and [Update and delete records](/docs/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/relationships'].post.requestBody.content['application/json']
    description: Create Relationship.bru request (2026-09-15)
    update:
      examples:
        create:
          summary: Create a relationship type
          value:
            name: Spare Parts

  - target: $.paths['/api/v3/relationships'].post.responses['201']
    description: Create Relationship.bru "201 - Success" (2026-09-15), sanitized, account_id omitted
    update:
      description: Created. `data` holds the new relationship type, with its derived `label`.
      content:
        application/json:
          examples:
            created:
              summary: Relationship type created
              value:
                data:
                  id: 6a1f0c2e9b3d4a5f8c7e1f03
                  name: Spare Parts
                  label: spare_parts
                  status: ACTIVE
                  created: '2026-09-15T17:06:20.283000'
                  modified: '2026-09-15T17:06:20.284000'
                errors: []

  - target: $.paths['/api/v3/relationships'].post.responses['409']
    description: Create Relationship.bru "409 - Duplicate Name" (2026-09-15), GEN-1
    update:
      description: A relationship type with this name already exists in your account. Nothing was created.
      content:
        application/json:
          examples:
            duplicateName:
              summary: Name already exists
              value:
                data: []
                errors:
                  - name: AlreadyExists
                    description: A Relationship with same name already exists

  # --- GET /api/v3/relationships/{identifier} ------------------------------------
  - target: $.paths['/api/v3/relationships/{identifier}'].get
    description: Get Relationship by ID.bru (2026-09-21), Update and Delete Relationship.bru 404 after delete (2026-09-15)
    update:
      summary: Get a relationship
      operationId: get-relationship
      description: Returns one relationship type by its ID. Use it to resolve the `relationship_id` you find in a product's `product_relationships`. An ID that matches no relationship type returns `404`.

  - target: $.paths['/api/v3/relationships/{identifier}'].get.parameters[?(@.name=='identifier' && @.in=='path')]
    description: config "ID prefixes"; Get Relationship by ID.bru (resolves a product's relationship_id)
    update:
      description: ID of the relationship type, a 24-character hexadecimal string such as `6a1f0c2e9b3d4a5f8c7e1f01`. A product's `product_relationships` holds it as `relationship_id`.

  - target: $.paths['/api/v3/relationships/{identifier}'].get.responses['200'].content['application/json']
    description: Get Relationship by ID.bru "200 - Success" (2026-09-21), sanitized, placeholder name/label, account_id omitted
    update:
      examples:
        relationship:
          summary: A relationship type
          value:
            data:
              id: 6a1f0c2e9b3d4a5f8c7e1f01
              name: Accessories
              label: accessories
              status: ACTIVE
              created: '2026-06-22T08:44:08.719000'
              modified: '2026-06-22T08:44:08.719000'
            errors: []

  - target: $.paths['/api/v3/relationships/{identifier}'].get.responses['404'].content['application/json']
    description: Update and Delete Relationship.bru "404 - After Delete" (2026-09-15)
    update:
      examples:
        notFound:
          summary: No relationship type with this ID
          value:
            data: []
            errors:
              - name: NotFoundError
                description: Document with id 6a1f0c2e9b3d4a5f8c7e1f99 not found

  # --- PATCH /api/v3/relationships/{identifier} -----------------------------------
  - target: $.paths['/api/v3/relationships/{identifier}'].patch
    description: Q#60 (name only), Update and Delete Relationship.bru (2026-09-15, label unchanged after rename; 200 then, 204 per Q#84/Q#116, VERIFY.md), spec RelationshipUpdateInputDto (additionalProperties false)
    update:
      summary: Rename a relationship
      operationId: update-relationship
      description: |-
        Changes a relationship type's name. `name` is the only field you can change here, and other fields return `422`. A successful update returns `204` with an empty body.

        The `label` stays as it was when the type was created, so a type renamed from "Spare Parts" to "Replacement Parts" keeps the label `spare_parts`. See [Update and delete records](/docs/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/relationships/{identifier}'].patch.requestBody.content['application/json']
    description: Update and Delete Relationship.bru PATCH request (2026-09-15)
    update:
      examples:
        rename:
          summary: Rename the relationship type
          value:
            name: Replacement Parts

  - target: $.paths['/api/v3/relationships/{identifier}'].patch.responses['204']
    description: Q#84, Q#116
    update:
      description: Renamed. The response has no body.

  # --- DELETE /api/v3/relationships/{identifier} ----------------------------------
  - target: $.paths['/api/v3/relationships/{identifier}'].delete
    description: Q#60, Update and Delete Relationship.bru DELETE 204 + GET 404 (2026-09-15, scratch type with no product links); effect on product links unknown (REL-20)
    update:
      summary: Delete a relationship
      operationId: delete-relationship
      description: |-
        Deletes one relationship type. A successful delete returns `204` with an empty body, and a later request for the relationship type returns `404`.

        To remove one product's link to a type without deleting the type, use [Remove a relationship from a product](/docs/reference/v3/productrelationships/delete-product-relationship). See [Update and delete records](/docs/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/relationships/{identifier}'].delete.responses['204']
    description: Update and Delete Relationship.bru (2026-09-15)
    update:
      description: Deleted. The response has no body.

  # --- /api/v3/relationships/{identifier}/{path} ----------------------------------
  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].get
    description: Q#15 (subpath discovery 400 on every resource), Get Relationship by ID.bru (raw field list 2026-09-08/21); 200 body for a valid path not captured (VERIFY.md)
    update:
      summary: Get a relationship field
      operationId: get-relationship-field
      description: |-
        Returns the value of one field of a relationship type, such as `label`, without the rest of the record. `data` holds the field's value.

        A field the relationship type doesn't have returns `400`. The error lists the fields you can ask for.

  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].get.responses['400'].content['application/json']
    description: Q#15 message format; field list from Get Relationship by ID.bru subpath discovery (2026-09-08/21)
    update:
      examples:
        unknownField:
          summary: Field the relationship type doesn't have
          value:
            data: []
            errors:
              - name: ValueError
                description: "Field 'colour' not found. Available fields: ['id', 'account_id', 'name', 'label', 'status', 'created', 'modified']"

  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].get.parameters[?(@.name=='path' && @.in=='path')]
    description: Get Relationship by ID.bru raw field list
    update:
      description: The field to read, such as `name`, `label`, or `status`.

  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].patch
    description: Never tested on relationships (spec only; no request body declared, proposed fix REL-22). Redirect only.
    update:
      summary: Update a relationship field
      operationId: update-relationship-field
      description: To rename a relationship type, use [Rename a relationship](/docs/reference/v3/relationships/update-relationship), which documents the request body. `name` is the only field you can change.

  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].patch.parameters[?(@.name=='path' && @.in=='path')]
    description: Q#60 (name only; label is derived and read-only)
    update:
      description: The field to change. Only `name` can be changed.

  - target: $.paths['/api/v3/relationships/{identifier}/{path}'].delete
    description: Never tested; FAM-1 answer (DELETE under an instance only for custom attributes and links). Redirect only; consider on-hold.
    update:
      summary: Delete a relationship field
      operationId: delete-relationship-field
      description: To delete a relationship type, use [Delete a relationship](/docs/reference/v3/relationships/delete-relationship). To remove one product's link to a type, use [Remove a relationship from a product](/docs/reference/v3/productrelationships/delete-product-relationship).

# Operation edits for the products endpoints.
#
# Phase 1 pilot (search, create, update) and Phase 2 (get, delete, field routes),
# written to .claude/skills/writer/references/overlay-authoring.md.
#
# Sources: config/api-testing.config.md quirks (Q#), feedback-flags.md (FB-),
# Plytix answers in "Questions for the Plytix Dev Team.md", bruno-collection/.
overlay: 1.0.0
info:
  title: products operations
  version: 1.0.0
actions:
  # --- GET /api/v3/products (pilot) -------------------------------------------
  - target: $.paths['/api/v3/products'].get
    description: Q#8-13, Q#89-92, Q#99-100, FB-009, FB-016, FB-027, FB-029, FB-031
    update:
      summary: Search products
      operationId: search-products
      description: |-
        Returns the products in your account that match your filters, one page at a time. With no filters, it returns every product, including archived ones.

        Use it to look up products by SKU or any other field, to export your catalog page by page, or to find products that changed after a given date.

        Filters are query parameters written as `field=value` or `field[operator]=value`. A product must match all of them, unless you group filters with `_or`. Besides the top-level fields, you can filter on:

        - Custom attributes, through `attributes.<label>`, for example `attributes.material=Canvas`
        - Related records, through dot paths such as `categories.name`
        - A parent's direct variants, through `parent_id=<id>` or `parent.sku=<sku>`

        A few filter details to plan for:

        - For a case-insensitive match, use `contains:ignorecase`. `icontains` isn't an operator and returns `400`.
        - A date filter with an invalid date, such as `modified[gte]=not-a-date`, returns an empty list instead of an error.

        Results come back 25 per page by default, up to 1000 with `_page_size`. To get the next page, follow `pagination.next_page`. On the last page that key is left out, not set to `null`. The link starts with `http://`, so change it to `https://` before you follow it. Otherwise the redirect can drop your `Authorization` header. The response doesn't include a total count.

        For a stable order while you page through a large result set, sort by `id`, which follows creation order. Each page is a separate request. See [Rate limits](/reference/v3/rate-limits).

        Related pages:

        - [Filtering and search](/reference/v3/filtering-and-search)
        - [Pagination](/reference/v3/pagination)
        - [Export your full catalog](/docs/guides/exporting-your-full-catalog)
        - [Audit product data quality with filters](/docs/guides/auditing-product-data-quality-with-filters)

  - target: $.paths['/api/v3/products'].get.parameters[?(@.name=='_fields' && @.in=='query')]
    description: Q#10, Q#12, Q#100, Q#113, PROD-3
    update:
      description: |-
        Fields to return for each product. Repeat the parameter once per field, for example `_fields=sku&_fields=label`. Leave it out, or send `_fields=*`, to get every field.

        `categories` and `assets` come back as full objects, so you don't need a second request. Ask for `categories`, not `category_ids`: `category_ids` doesn't exist and returns `400`.

        `product_relationships` returns only each relationship's ID and label. To get the related products, use [Search related products](/reference/v3/related-products/search-related-products) with `product_id=<id>`.

  - target: $.paths['/api/v3/products'].get.parameters[?(@.name=='_sort_by' && @.in=='query')]
    description: Q#9, Q#100, FB-009, FB-029
    update:
      description: |-
        Field to sort by, in ascending order. Prefix the field with `-` to sort in descending order, for example `_sort_by=-modified`. Repeat the parameter to sort by several fields, applied in the order you list them.

        These fields are confirmed sortable: `sku`, `id`, `status`, `created`, `modified`, `product_level`, `num_variations`, `label`, `gtin`, `parent_id`, and `product_family_id`. Sorting by the same field twice, or by `thumbnail_id`, returns `400`.

        If you also send `_fields`, include each sort field in it. Otherwise the request returns `400`.

  - target: $.paths['/api/v3/products'].get.responses['200'].content['application/json']
    description: List Products.bru captures (2026-09-04 to 2026-10-01), sanitized
    update:
      examples:
        filtered:
          summary: Filter and select fields
          description: '`GET /api/v3/products?status=Draft&created[gt]=2026-01-01&_fields=id&_fields=sku&_fields=label&_fields=status&_fields=created&_sort_by=sku`. All results fit on one page, so `pagination` is empty.'
          value:
            x-example-file: products/search-200-filtered.json
        firstPage:
          summary: First page of several
          description: '`GET /api/v3/products?_fields=sku&_fields=status&_page_size=2`. Only `next_page` is present.'
          value:
            x-example-file: products/search-200-first-page.json
        lastPage:
          summary: Last page
          description: '`GET /api/v3/products?_fields=sku&_page_size=20&_page=5`. Only `previous_page` is present.'
          value:
            x-example-file: products/search-200-last-page.json

  - target: $.paths['/api/v3/products'].get.responses['400'].content['application/json']
    description: PROD-3, FB-010
    update:
      examples:
        unknownField:
          summary: Field that doesn't exist
          value:
            data: []
            errors:
              - name: InvalidFieldError
                description: Field 'category_ids' does not exist.

  - target: $.paths['/api/v3/products'].get.responses['422'].content['application/json']
    description: List Products.bru "422 - Pagination Bounds" (2026-10-01), Q#90
    update:
      examples:
        pageOutOfRange:
          summary: Page number below 1
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'query._page: Input should be greater than or equal to 1'

  # --- POST /api/v3/products (pilot) ------------------------------------------
  - target: $.paths['/api/v3/products'].post
    description: Q#19, Q#28, Q#30, Q#33, Q#46, Q#93, Q#98, Q#104, Q#117, FB-032, PROD-11
    update:
      summary: Create a product
      operationId: create-product
      description: |-
        Creates one product and returns the full record, including its new `id`. Only `sku` is required.

        The `sku` must be unique in your account. If a product with that SKU already exists, the request returns `409` and creates nothing. That makes a create safe to retry: if a request times out, sending it again either creates the product or returns `409`, never a duplicate.

        Set custom attribute values in `attributes`, keyed by each attribute's `label` (its snake_case name, not the display name), for example `{"attributes": {"material": "Canvas"}}`. The response also lists the account's completeness attributes, such as `website_ready`, which Plytix calculates for you.

        To create a variant, set `parent_id` to the parent product's ID:

        - The variant joins the parent's product family automatically, so you can leave out `product_family_id`. Sending a different family returns `422`.
        - The variant gets `product_level` `2`, and a parent that was standalone becomes `1`. A variant of a variant is `3`.

        See [Reconstruct parent/variant hierarchies](/docs/guides/reconstructing-parent-variant-hierarchies).

        The body accepts only the fields listed below. List fields such as `category_ids` and `static_list_ids` return `422` with "Extra inputs are not permitted". Link categories after the product exists, with [Link a record to a product](/reference/v3/products/add-product-field).

  - target: $.paths['/api/v3/products'].post.requestBody.content['application/json']
    description: Create Product - Full Featured.bru (minus category_ids/static_list_ids, now rejected per Q#93)
    update:
      examples:
        standalone:
          summary: Standalone product
          value:
            sku: BAG-10157
            label: Canvas Backpack
            gtin: '4006381333931'
            status: Draft
            product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
            thumbnail_id: 6a1f0c2e9b3d4a5f8c7e1b01
            attributes:
              material: Canvas
        variant:
          summary: Variant of an existing product
          description: The variant joins the parent's product family, so `product_family_id` is left out.
          value:
            sku: BAG-10157-BLK
            label: Canvas Backpack, Black
            parent_id: 6a1f0c2e9b3d4a5f8c7e1a01
        minimal:
          summary: Only the required field
          value:
            sku: BAG-10157

  - target: $.paths['/api/v3/products'].post.responses['201']
    description: Q#19, Q#117
    update:
      description: Created. `data` holds the complete product record, not only its ID.
      content:
        application/json:
          examples:
            standalone:
              summary: Standalone product
              value:
                x-example-file: products/create-201-standalone.json
            variant:
              summary: Variant
              description: '`product_level` is `2` and `product_family_id` matches the parent''s.'
              value:
                x-example-file: products/create-201-variant.json

  - target: $.paths['/api/v3/products'].post.responses['409']
    description: Q#33, GEN-1
    update:
      description: A product with this `sku` already exists in your account. Nothing was created. The message doesn't name the field, so check the SKU first.
      content:
        application/json:
          examples:
            duplicateSku:
              summary: SKU already exists
              value:
                data: []
                errors:
                  - name: AlreadyExists
                    description: product data validation failed

  - target: $.paths['/api/v3/products'].post.responses['422'].content['application/json']
    description: Create Product - Full Featured.bru (2026-09-07), Q#93, Q#98
    update:
      examples:
        missingSku:
          summary: Missing sku
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'sku: Field required'
        unsupportedField:
          summary: Field the body doesn't accept
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'category_ids: Extra inputs are not permitted'
        familyMismatch:
          summary: Variant with a different product family than its parent
          value:
            data: []
            errors:
              - name: ValidationError
                description: product data validation failed

  # --- PATCH /api/v3/products/{identifier} (pilot) ----------------------------
  - target: $.paths['/api/v3/products/{identifier}'].patch
    description: Q#82, Q#84, Q#85, Q#87, Q#93, Q#97, Q#98, Q#118, FB-007, FB-020, FB-022, ASSET-3 (30/09/2026)
    update:
      summary: Update a product
      operationId: update-product
      description: |-
        Changes the fields you send and leaves every other field as it is. A successful update returns `204` with an empty body. To see the result, read the product back.

        The `attributes` map is the exception: it's replaced as a whole. Any custom attribute you leave out of `attributes` is removed from the product. To change custom attributes, do one of the following:

        - Send the complete `attributes` map, with the values you want to keep.
        - Change one attribute at a time with [Update a product field](/reference/v3/products/update-product-field), for example `PATCH /api/v3/products/{identifier}/attributes/material`.

        Completeness and formula attributes are calculated by Plytix. Values you send for them are ignored.

        Send `null` to clear a field:

        - `thumbnail_id: null` removes the thumbnail. If the thumbnail was the asset's only link to the product, the asset also leaves the product's `assets`.
        - `parent_id: null` detaches a variant from its parent. The product goes back to `product_level` `0`, loses the values it inherited, and keeps its product family.
        - `product_family_id: null` removes the product from its product family.

        `gtin` can't be cleared with `null`. A GTIN with an invalid check digit returns `422`.

        Don't send `product_family_id` in the same request as `parent_id`: sending both returns `422`.

        The body accepts only the fields listed below. You can't change `sku` here, and list fields such as `category_ids` and `static_list_ids` return `422`. See [Update and delete records](/reference/v3/updates-and-deletes) for how PATCH works across the V3 API.

  - target: $.paths['/api/v3/products/{identifier}'].patch.parameters[?(@.name=='identifier' && @.in=='path')]
    description: config "ID prefixes"; SKU on PATCH untested (PROD-12)
    update:
      description: ID of the product to update, a 24-character hexadecimal string such as `6a1f0c2e9b3d4a5f8c7e1a01`. Search by `sku` to find a product's ID.

  - target: $.paths['/api/v3/products/{identifier}'].patch.requestBody.content['application/json']
    description: Q#85, Q#97, FB-022
    update:
      examples:
        fields:
          summary: Change the label and status
          value:
            label: Canvas Backpack, 20 L
            status: Completed
        attributes:
          summary: Replace custom attribute values
          description: Send every custom attribute you want to keep. Attributes left out of the map are removed.
          value:
            attributes:
              material: Canvas
              color: Black
        clearThumbnail:
          summary: Remove the thumbnail
          value:
            thumbnail_id: null
        detachVariant:
          summary: Detach a variant from its parent
          value:
            parent_id: null

  - target: $.paths['/api/v3/products/{identifier}'].patch.responses['204']
    description: Q#84, ASSET-3
    update:
      description: Updated. The response has no body. Read the product to see the new values.

  - target: $.paths['/api/v3/products/{identifier}'].patch.responses['422'].content['application/json']
    description: Q#82, Q#93, Q#118
    update:
      examples:
        parentAndFamily:
          summary: parent_id and product_family_id in the same request
          value:
            data: []
            errors:
              - name: ValidationError
                description: product data validation failed
        unsupportedField:
          summary: Field the body doesn't accept
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'category_ids: Extra inputs are not permitted'
        invalidGtin:
          summary: GTIN with an invalid check digit
          value:
            data: []
            errors:
              - name: ValidationError
                description: product data validation failed
        gtinTooShort:
          summary: GTIN shorter than 8 characters
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'gtin: String should have at least 8 characters'

  # --- GET /api/v3/products/{identifier} (Phase 2) ------------------------------
  - target: $.paths['/api/v3/products/{identifier}'].get
    description: Q#86, Q#91, Q#113, FB-004, PROD-5, PROD-9
    update:
      summary: Get a product
      operationId: get-product
      description: |-
        Returns one product. You can use the product's `id` or its SKU as the identifier: `GET /api/v3/products/BAG-10157` returns the same record as a request with the product's ID. An identifier that matches nothing returns `404`.

        To return only some fields, use `_fields`, for example `_fields=sku&_fields=label`. Without it, you get the full record.

        `data` holds the product object itself, not a list, and the response has no `pagination` key.

        `product_relationships` lists only each relationship's ID and label. To get the related products, use [Search related products](/reference/v3/related-products/search-related-products) with `product_id=<id>`.

  - target: $.paths['/api/v3/products/{identifier}'].get.parameters[?(@.name=='identifier' && @.in=='path')]
    description: Q#86 (GET only)
    update:
      description: The product's `id` (a 24-character hexadecimal string) or its SKU.

  - target: $.paths['/api/v3/products/{identifier}'].get.responses['200'].content['application/json']
    description: FB-004 (2026-10-15) "returns only sku (200)"
    update:
      examples:
        selectedFields:
          summary: One field, with _fields
          description: '`GET /api/v3/products/BAG-10157?_fields=sku`'
          value:
            data:
              sku: BAG-10157
            errors: []

  - target: $.paths['/api/v3/products/{identifier}'].get.responses['404'].content['application/json']
    description: Get Product by ID.bru "404 - Not Found After Delete" (2026-09-23)
    update:
      examples:
        notFound:
          summary: No product with this identifier
          value:
            data: []
            errors:
              - name: NotFoundError
                description: Document with id 6a1f0c2e9b3d4a5f8c7e1a99 not found

  # --- DELETE /api/v3/products/{identifier} (Phase 2) ---------------------------
  - target: $.paths['/api/v3/products/{identifier}'].delete
    description: Q#28, Q#116, Delete Product.bru "204 - Standard Delete" + follow-up GET 404 (2026-09-23), FB-027
    update:
      summary: Delete a product
      operationId: delete-product
      description: |-
        Deletes one product. A successful delete returns `204` with an empty body, and a later request for the product returns `404`. Deleted products can't be listed afterwards, so a sync job can't find deletions by searching.

        To remove only a link, such as one category, without deleting the product, use [Delete a product field value or link](/reference/v3/products/delete-product-field). See [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/products/{identifier}'].delete.parameters[?(@.name=='identifier' && @.in=='path')]
    description: config "ID prefixes"; SKU on DELETE untested (PROD-12)
    update:
      description: ID of the product to delete, a 24-character hexadecimal string such as `6a1f0c2e9b3d4a5f8c7e1a01`. Search by `sku` to find a product's ID.

  - target: $.paths['/api/v3/products/{identifier}'].delete.responses['204']
    description: Q#28
    update:
      description: Deleted. The response has no body.

  # --- GET /api/v3/products/{identifier}/{path} (Phase 2) ------------------------
  - target: $.paths['/api/v3/products/{identifier}/{path}'].get
    description: Q#15, Q#16, Q#80 (superseded by FB-026, 2026-10-15), FB-024, PROD-6
    update:
      summary: Get a product field
      operationId: get-product-field
      description: |-
        Returns the value of one product field without the rest of the record. Set `path` to the field:

        - `attributes` returns the product's custom attribute values as a map, and `attributes/<label>` returns one attribute's value.
        - `categories` and `assets` return the records linked to the product.

        `data` holds the value itself, so its shape depends on the field. A field the product doesn't have returns `400`, naming the field.

        Relationships aren't available here: read `product_relationships` with [Get a product](/reference/v3/products/get-product).

  - target: $.paths['/api/v3/products/{identifier}/{path}'].get.parameters[?(@.name=='path' && @.in=='path')]
    description: Q#16, FB-026
    update:
      description: The field to read, such as `attributes`, `attributes/material`, or `categories`.

  - target: $.paths['/api/v3/products/{identifier}/{path}'].get.responses['200'].content['application/json']
    description: Get Product Subpath - Attributes.bru "200 - Attributes Subpath (Full Map)" (2026-09-07); Unlink Category from Product.bru "Verify After Unlink" (2026-10-08)
    update:
      examples:
        attributes:
          summary: All custom attribute values
          description: '`GET /api/v3/products/{identifier}/attributes`'
          value:
            data:
              material: Canvas
              color: Black
              amazon_ready: 85.71
              website_ready: 100.0
            errors: []
        oneAttribute:
          summary: One attribute value
          description: '`GET /api/v3/products/{identifier}/attributes/material`'
          value:
            data: Canvas
            errors: []
        categories:
          summary: Linked categories
          description: '`GET /api/v3/products/{identifier}/categories`'
          value:
            data:
              - id: 6a1f0c2e9b3d4a5f8c7e1c02
                name: Backpacks
                parent_id: 6a1f0c2e9b3d4a5f8c7e1c01
                path:
                  - Bags
                  - Backpacks
                slug: backpacks
                order: 1
                n_children: 0
            errors: []
            pagination: {}

  # --- POST /api/v3/products/{identifier}/{path} (Phase 2) -----------------------
  - target: $.paths['/api/v3/products/{identifier}/{path}'].post
    description: Q#94, Q#96, Q#105, Q#107, PROD-7, PROD-8, FAM-1, Link Category to Product.bru (2026-10-08)
    update:
      summary: Link a record to a product
      operationId: add-product-field
      description: |-
        Links one record to the product. Set `path` to the link collection, for example `categories`, and send the record's ID as `{"id": "<id>"}`.

        A successful link returns `201` with the linked ID. Send one record per request: the body doesn't take a list of IDs.

        If the record is already linked to the product, the request returns `409`. An ID that doesn't exist returns `404`.

        Assets can't be linked here. To use an asset on a product, set it as the product's `thumbnail_id` or as a value of a media attribute. See [Safely remove categories, assets, or relationships](/docs/guides/safely-removing-categories-assets-or-relationships#connect-other-assets-to-a-product) and [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/products/{identifier}/{path}'].post.parameters[?(@.name=='path' && @.in=='path')]
    description: Q#94, Q#105
    update:
      description: The link collection, for example `categories`.

  - target: $.paths['/api/v3/products/{identifier}/{path}'].post.responses['201']
    description: Link Category to Product.bru 201 (2026-10-08)
    update:
      description: Linked. `data.id` is the ID of the linked record.
      content:
        application/json:
          examples:
            linked:
              summary: Category linked
              value:
                data:
                  id: 6a1f0c2e9b3d4a5f8c7e1c02
                errors: []

  - target: $.paths['/api/v3/products/{identifier}/{path}'].post.responses['409']
    description: Link Category to Product.bru 409 (2026-10-08), Q#94
    update:
      description: The record is already linked to this product. Nothing changed.
      content:
        application/json:
          examples:
            alreadyLinked:
              summary: Category already linked
              value:
                data: []
                errors:
                  - name: AlreadyExists
                    description: "'6a1f0c2e9b3d4a5f8c7e1c02' is already linked to products 6a1f0c2e9b3d4a5f8c7e1a01 through 'categories'"

  - target: $.paths['/api/v3/products/{identifier}/{path}'].post.responses['422'].content['application/json']
    description: Link Category to Product.bru 422 (2026-10-08)
    update:
      examples:
        wrongBody:
          summary: List field instead of id
          description: 'Body `{"category_ids": ["6a1f0c2e9b3d4a5f8c7e1c02"]}`'
          value:
            data: []
            errors:
              - name: InputDTOValidationError
                description: 'id: Field required'
              - name: InputDTOValidationError
                description: 'category_ids: Extra inputs are not permitted'

  # --- PATCH /api/v3/products/{identifier}/{path} (Phase 2) ----------------------
  - target: $.paths['/api/v3/products/{identifier}/{path}'].patch
    description: Q#84, Q#87, Q#95, FB-006, FB-007, FB-020, ASSET-3, status map ("only work on attributes")
    update:
      summary: Update a product field
      operationId: update-product-field
      description: |-
        Changes one custom attribute value and leaves the rest of the product as it is. Set `path` to `attributes/<label>` and send the new value on its own as the request body: `"Canvas"`, not `{"value": "Canvas"}`. A successful update returns `204` with an empty body.

        Use this to change a single attribute. [Update a product](/reference/v3/products/update-product) replaces the whole `attributes` map, so any attribute you leave out of it is removed.

        The value's format depends on the attribute type:

        - Text: a string. `null` removes the value.
        - Decimal: a string, such as `"12.5"`. A JSON number returns `422`.
        - Multi-select: an array of the attribute's configured options, such as `["Cotton"]`.
        - Media: one asset ID, as a string.
        - Media gallery: an array of asset IDs.

        Completeness and formula attributes are calculated by Plytix, so writing to them returns `422`.

        Link collections such as `categories` can't be changed here (`405`). Link and unlink records with [Link a record to a product](/reference/v3/products/add-product-field) and [Delete a product field value or link](/reference/v3/products/delete-product-field). See [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/products/{identifier}/{path}'].patch.parameters[?(@.name=='path' && @.in=='path')]
    description: Q#87
    update:
      description: '`attributes/` followed by the attribute''s `label`, for example `attributes/material`.'

  - target: $.paths['/api/v3/products/{identifier}/{path}'].patch.responses['204']
    description: Q#87
    update:
      description: Updated. The response has no body.

  - target: $.paths['/api/v3/products/{identifier}/{path}'].patch.responses['405']
    description: Q#95 (2026-10-08)
    update:
      description: The path is a link collection, which can't be changed with `PATCH`.
      content:
        application/json:
          examples:
            linkCollection:
              summary: PATCH on categories
              value:
                data: []
                errors:
                  - name: MethodNotAllowed
                    description: "PATCH is not allowed on 'categories': link or unlink here, and update a linked entity at its own path."

  # --- DELETE /api/v3/products/{identifier}/{path} (Phase 2) ---------------------
  - target: $.paths['/api/v3/products/{identifier}/{path}'].delete
    description: Q#94, Q#95, Q#96, Q#105, FB-006, FB-021, FB-034, status gating #4, Unlink Category from Product.bru (2026-10-08)
    update:
      summary: Delete a product field value or link
      operationId: delete-product-field
      description: |-
        Removes one value from a product. Two forms work:

        - `attributes/<label>` removes that custom attribute's value from the product.
        - `categories/<category_id>` unlinks that one category. The category itself isn't deleted, and the product's other links stay.

        A successful call returns `204` with an empty body. The product itself is never deleted.

        If a variant overrode a value it inherited from its parent, deleting the value doesn't bring the parent's value back. The attribute is removed from the variant, and `attributes.<label>` stays in `overwritten_attributes`.

        A collection without an ID, such as `categories` on its own, returns `405`. A field the product doesn't have returns `404`, and so does a record that isn't linked to the product.

        Assets can't be unlinked here. To detach one, clear the product's `thumbnail_id`, or delete the media attribute value that holds it.

        See [Safely remove categories, assets, or relationships](/docs/guides/safely-removing-categories-assets-or-relationships#remove-a-category-from-a-product) and [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/products/{identifier}/{path}'].delete.parameters[?(@.name=='path' && @.in=='path')]
    description: Q#94, FB-006
    update:
      description: '`attributes/<label>` to remove an attribute value, or `<collection>/<id>` (for example `categories/6a1f0c2e9b3d4a5f8c7e1c02`) to unlink one record.'

  - target: $.paths['/api/v3/products/{identifier}/{path}'].delete.responses['204']
    description: Q#94
    update:
      description: Removed. The response has no body.

  - target: $.paths['/api/v3/products/{identifier}/{path}'].delete.responses['404'].content['application/json']
    description: Q#95, FB-034, Q#105
    update:
      examples:
        noSuchField:

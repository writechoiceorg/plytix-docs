# Operation edits for the family-attributes endpoints: the links between a
# product family and its attributes, each with an inheritance `level`.
#
# Rewritten in Phase 2 (2026-10-20). Sources: config/api-testing.config.md (Q#),
# feedback-flags.md (FB-), bruno-collection/13-Product-Families/, the data model
# guide. Success bodies for the identity POST and PATCH, and the field routes,
# are spec-only so far (VERIFY.md). Per PM-25, don't present the collection POST
# at `parent_level` as a workaround for the PATCH 403.
overlay: 1.0.0
info:
  title: family-attributes operations
  version: 1.0.0
actions:
  # --- GET /api/v3/family-attributes --------------------------------------------
  - target: $.paths['/api/v3/family-attributes'].get
    description: Q#74, Q#112, FB-025, SEC-1, Get Family Attributes (Top-Level).bru
    update:
      summary: Search family attributes
      operationId: search-family-attributes
      description: |-
        Returns the links between product families and attributes in your account, one page at a time. Each record names a `product_family_id`, an `attribute_id`, and the link's `level`.

        To get one family's attributes, filter by `product_family_id`. Without a filter, the search covers every product family in your account.

        `level` sets how the attribute's values pass down a family's hierarchy:

        - `parent_level`: a parent's value passes down to its variants and sub-variants.
        - `variant_level`: a variant's value passes down to its sub-variants.
        - `no_level`: values don't pass down.

        See [The Plytix data model](/docs/guides/data-model#product-families-and-variants). Records hold IDs only. To get an attribute's name and type, look it up with [Search product attributes](/reference/v3/product-attributes/search-product-attributes).

        Related pages:

        - [Filtering and search](/reference/v3/filtering-and-search)
        - [Pagination](/reference/v3/pagination)

  - target: $.paths['/api/v3/family-attributes'].get.parameters[?(@.name=='filters' && @.in=='query')]
    description: 'PM-50; field names from the resource''s response schema, operators per the API-wide grammar (Q#11, Q#99)'
    update:
      example:
        product_family_id: 6a1f0c2e9b3d4a5f8c7e1a02

  # --- GET /api/v3/product-families/{product_family_id}/attributes ----------------
  - target: $.paths['/api/v3/family-attributes'].get.responses['200'].content['application/json']
    description: "Get Family Attributes (Top-Level).bru \"200 - Filtered by account_id (Safe/Scoped)\" (2026-09-15), sanitized; keys match the GET .../attributes example"
    update:
      examples:
        firstPage:
          summary: First page
          description: '`GET /api/v3/family-attributes?_page_size=2`'
          value:
            data:
              - product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
                attribute_id: 6a1f0c2e9b3d4a5f8c7e1e01
                level: no_level
              - product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
                attribute_id: 6a1f0c2e9b3d4a5f8c7e1e02
                level: parent_level
            errors: []
            pagination:
              next_page: http://<api-host>/api/v3/family-attributes?_page=2&_page_size=2

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].get
    description: Get Family Attributes Collection.bru (2026-09-15/21), Q#73
    update:
      summary: List a product family's attributes
      operationId: list-family-attributes
      description: |-
        Returns the attributes linked to one product family, with each link's `level`. Each record names the `product_family_id`, the `attribute_id`, and the `level`.

        Records hold IDs only. To get an attribute's name and type, look it up with [Search product attributes](/reference/v3/product-attributes/search-product-attributes).

        To filter or page through links, including across families, use [Search family attributes](/reference/v3/family-attributes/search-family-attributes).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].get.responses['200'].content['application/json']
    description: Get Family Attributes Collection.bru (2026-09-15), sanitized, account_id omitted (Q#112)
    update:
      examples:
        links:
          summary: A family's attribute links
          value:
            data:
              - product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
                attribute_id: 6a1f0c2e9b3d4a5f8c7e1e01
                level: no_level
              - product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
                attribute_id: 6a1f0c2e9b3d4a5f8c7e1e02
                level: parent_level
            errors: []

  # --- POST /api/v3/product-families/{product_family_id}/attributes ---------------
  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].post
    description: Q#61, FB-036, status gating #4, Create Family Attribute Link.bru (2026-09-15)
    update:
      summary: Link an attribute to a product family
      operationId: add-attribute-to-family
      description: |-
        Links an existing attribute to the product family, so products in the family can hold a value for that attribute. Send the attribute's ID in `attribute_id`, and optionally a `level`. Without `level`, the attribute is linked at `no_level`.

        A successful link returns `201` with the new link record. A body without `attribute_id` returns `422`.

        To link an attribute without a request body, use [Link an attribute to a product family by URL](/reference/v3/family-attributes/add-attribute-to-family-by-id). See [The Plytix data model](/docs/guides/data-model#product-families-and-variants) for how levels work, and [Update and delete records](/reference/v3/updates-and-deletes) for how writes behave across the V3 API.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].post.requestBody.content['application/json']
    description: Create Family Attribute Link.bru request (2026-09-15)
    update:
      examples:
        defaultLevel:
          summary: Link at the default level (no_level)
          value:
            attribute_id: 6a1f0c2e9b3d4a5f8c7e1e03

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].post.responses['201']
    description: Create Family Attribute Link.bru 201 (2026-09-15), sanitized, account_id omitted (Q#112)
    update:
      description: Linked. `data` holds the new link record.
      content:
        application/json:
          examples:
            linked:
              summary: Attribute linked
              value:
                data:
                  product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
                  attribute_id: 6a1f0c2e9b3d4a5f8c7e1e03
                  level: no_level
                errors: []

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes'].post.responses['422'].content['application/json']
    description: Create Family Attribute Link.bru 422 (2026-09-15), verbatim message
    update:
      examples:
        missingAttributeId:
          summary: Missing attribute_id
          value:
            data: []
            errors:
              - name: ValidationError
                description: |-
                  1 validation error for FamilyAttributeLinkInputDto
                  attribute_id
                    Field required [type=missing, input_value={}, input_type=dict]

  # --- /api/v3/product-families/{product_family_id}/attributes/{attribute_id} ----
  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].get
    description: Get Family Attributes Collection.bru identity GET (2026-09-15/21); 404 from Create Family Attribute Link.bru
    update:
      summary: Get a family attribute
      operationId: get-family-attribute
      description: |-
        Returns the link between one product family and one attribute, including its `level`. If the attribute isn't linked to the family, the request returns `404`.

        To get every attribute linked to the family, use [List a product family's attributes](/reference/v3/family-attributes/list-family-attributes).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].get.responses['200'].content['application/json']
    description: "Get Family Attributes Collection.bru \"200 - Success (By ID)\" (2026-09-15/21), sanitized; keys match the collection example"
    update:
      examples:
        link:
          summary: One attribute link
          value:
            data:
              product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
              attribute_id: 6a1f0c2e9b3d4a5f8c7e1e01
              level: no_level
            errors: []

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].get.responses['404'].content['application/json']
    description: Create Family Attribute Link.bru GET-after-unlink 404 (2026-09-15)
    update:
      examples:
        notLinked:
          summary: Attribute isn't linked to the family
          value:
            data: []
            errors:
              - name: NotFoundError
                description: Association (product_family_id=6a1f0c2e9b3d4a5f8c7e1d01, attribute_id=6a1f0c2e9b3d4a5f8c7e1e03) not found

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].post
    description: Q#61 (409 when already linked, with or without a body); success 201 per spec, not captured (VERIFY.md)
    update:
      summary: Link an attribute to a product family by URL
      operationId: add-attribute-to-family-by-id
      description: |-
        Links the attribute in the URL to the product family, with no request body.

        If the attribute is already linked to the family, the request returns `409`. To set `level` in the same request, use [Link an attribute to a product family](/reference/v3/family-attributes/add-attribute-to-family).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].post.responses['201'].content['application/json']
    description: "Unverified: success 201 not captured (VERIFY.md). Same body as POST .../attributes (captured), with the no_level default for a link sent without a level (api-testing.config.md status-gating #4)"
    update:
      examples:
        linked:
          summary: Attribute linked
          value:
            data:
              product_family_id: 6a1f0c2e9b3d4a5f8c7e1d01
              attribute_id: 6a1f0c2e9b3d4a5f8c7e1e03
              level: no_level
            errors: []

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].post.responses['409']
    description: Create Family Attribute Link.bru 409 (2026-09-15)
    update:
      description: The attribute is already linked to this product family. Nothing changed.
      content:
        application/json:
          examples:
            alreadyLinked:
              summary: Attribute already linked
              value:
                data: []
                errors:
                  - name: AlreadyExists
                    description: Attribute 6a1f0c2e9b3d4a5f8c7e1e03 is already linked to this product family.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].patch
    description: Update Family Attribute Level.bru (403 regardless of level), status gating #4 (error name Forbidden since 2026-10-08); success 204 per spec, not captured
    update:
      summary: Change a family attribute's level
      operationId: update-family-attribute
      description: |-
        Changes the `level` of an attribute's link to the product family. Send the new level, for example `{"level": "variant_level"}`. A successful change returns `204` with an empty body.

        Changing a level needs automatic inheritance on your account. Without it, the request returns `403` with "Automatic inheritance is not available for this account", whatever level you send. If you get this response, ask your Plytix contact whether inheritance is available for your account. See [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].patch.requestBody.content['application/json']
    description: Update Family Attribute Level.bru request
    update:
      examples:
        level:
          summary: Change the level
          value:
            level: variant_level

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].patch.responses['403'].content['application/json']
    description: status gating #4 (2026-10-14)
    update:
      examples:
        inheritanceUnavailable:
          summary: Automatic inheritance not available
          value:
            data: []
            errors:
              - name: Forbidden
                description: Automatic inheritance is not available for this account

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].delete
    description: Create Family Attribute Link.bru DELETE 204 + GET 404 (2026-09-15); effect on product values unknown (FAM-2)
    update:
      summary: Unlink an attribute from a product family
      operationId: remove-attribute-from-family
      description: |-
        Removes the link between the attribute and the product family. A successful unlink returns `204` with an empty body, and a later request for the link returns `404`.

        The attribute itself isn't deleted. To delete it from your account, use [Delete a product attribute](/reference/v3/product-attributes/delete-product-attribute).

        See [Update and delete records](/reference/v3/updates-and-deletes).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}'].delete.responses['204']
    update:
      description: Unlinked. The response has no body.

  # --- field routes (spec-only so far) ---------------------------------------------
  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].get
    description: Spec only; no live capture (VERIFY.md)
    update:
      summary: Get a family attribute field
      operationId: get-family-attribute-field
      description: Returns one field of the link between a product family and an attribute, such as `level`.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].get.responses['200'].content['application/json']
    description: "Sanitized, unverified: the 200 body for a field wasn't captured (VERIFY.md). Shape follows the products field route captures; values come from the GET-a-family-attribute example"
    update:
      examples:
        level:
          summary: One field of the link
          description: '`GET /api/v3/product-families/{product_family_id}/attributes/{attribute_id}/level`'
          value:
            data: no_level
            errors: []

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].patch
    description: Spec only; no live capture (VERIFY.md)
    update:
      summary: Update a family attribute field
      operationId: update-family-attribute-field
      description: To change a link's `level`, use [Change a family attribute's level](/reference/v3/family-attributes/update-family-attribute), which documents the request body and the account requirement.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].delete
    description: Spec only; no live capture (VERIFY.md)
    update:
      summary: Delete a family attribute field
      operationId: delete-family-attribute-field
      description: To remove an attribute from a product family, use [Unlink an attribute from a product family](/reference/v3/family-attributes/remove-attribute-from-family).

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].get.parameters[?(@.name=='path' && @.in=='path')]
    description: Fields of a family attribute link (Get Family Attributes Collection.bru)
    update:
      description: A field of the link, such as `level`.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].patch.parameters[?(@.name=='path' && @.in=='path')]
    description: Fields of a family attribute link (Get Family Attributes Collection.bru)
    update:
      description: A field of the link, such as `level`.

  - target: $.paths['/api/v3/product-families/{product_family_id}/attributes/{attribute_id}/{path}'].delete.parameters[?(@.name=='path' && @.in=='path')]
    description: Fields of a family attribute link (Get Family Attributes Collection.bru)
    update:
      description: A field of the link, such as `level`.

    update:
      summary: Update a product category field
      operationId: update-product-category-field
      description: To rename a category or move it under another parent, use [Update a product category](/reference/v3/product-categories/update-product-category), which documents the request body.

  - target: $.paths['/api/v3/product-categories/{identifier}/{path}'].patch.parameters[?(@.name=='path' && @.in=='path')]
    description: Patchable fields from ProductCategoryUpdateInputDto (spec)
    update:

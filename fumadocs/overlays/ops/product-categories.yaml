  # --- DELETE /api/v3/product-categories/{identifier}/{path} (spec only) ----------
  - target: $.paths['/api/v3/product-categories/{identifier}/{path}'].delete
    description: Spec only; no live capture (VERIFY.md, CAT-23)
    update:
      summary: Delete a product category field
      operationId: delete-product-category-field
      description: To delete a category, use [Delete a product category](/reference/v3/product-categories/delete-product-category). To take a product out of a category, unlink the category on the product. See [Safely remove categories, assets, or relationships](/docs/guides/safely-removing-categories-assets-or-relationships#remove-a-category-from-a-product).

  - target: $.paths['/api/v3/product-categories/{identifier}/{path}'].delete.parameters[?(@.name=='path' && @.in=='path')]
    description: Category fields (spec)
    update:

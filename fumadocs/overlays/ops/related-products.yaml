# Operation edits for the related-products endpoints.
# Phase 2 (2026-10-20): the search is published. The nested GETs under
# /products/{product_id}/relationships/{relationship_id}/related-products are on
# hold (visibility.yaml, VERIFY.md); their actions below are kept but not applied.
# Sources: Q#63, Q#64, Q#112, Q#113, Get Related Products (Top-Level).bru.
overlay: 1.0.0
info:
  title: related-products operations
  version: 1.0.0
actions:
  - target: $.paths['/api/v3/products/{product_id}/relationships/{relationship_id}/related-products/{related_product_id}'].get
    description: Migrated 2026-10-20 from the hand-edited openapi.json.
    update:
      description: |-
        Fetch a single product-to-product link: the record connecting `product_id` to `related_product_id` under `relationship_id`.

        > **Warning:** This endpoint returns `404 NotFoundError` for links that do exist, the same underlying problem that makes its [collection form](/reference/v3/related-products/get_related_products_collection_api_v3_products__product_id__relationships__relationship_id__related_products_get) come back empty. Don't use it to check whether two products are linked. Use [Search-Related-Products](/reference/v3/related-products/search-related-products) with `?product_id=<id>` instead.

        All three path segments take Plytix IDs, not SKUs.
    x-review: 'On hold (visibility.yaml): live behavior contradicts the spec (FB-024, 2026-10-15: POST 405, PATCH 422, collection GET 404; Q#63/Q#112: nested related-products GETs empty or 404, REL-1 "fix in progress"). This text is from before Phase 2: rewrite it when the operation is restored.'
  - target: $.paths['/api/v3/products/{product_id}/relationships/{relationship_id}/related-products/{related_product_id}/{path}'].get
    description: Migrated 2026-10-20 from the hand-edited openapi.json.
    update:
      description: |-
        Fetch a single field from one product-to-product link, such as `quantity`, instead of the whole record.

        > **Warning:** This resolves the link through the same lookup as [Get-Related-Products Identity](/reference/v3/related-products/get_related_products_identity_api_v3_products__product_id__relationships__relationship_id__related_products__related_product_id__get), which can't find links that do exist, so expect the same `404` here. Read a link's fields through [Search-Related-Products](/reference/v3/related-products/search-related-products) with `?product_id=<id>` and `_fields` instead.

        All path segments take Plytix IDs, not SKUs.
    x-review: 'On hold (visibility.yaml): live behavior contradicts the spec (FB-024, 2026-10-15: POST 405, PATCH 422, collection GET 404; Q#63/Q#112: nested related-products GETs empty or 404, REL-1 "fix in progress"). This text is from before Phase 2: rewrite it when the operation is restored.'
  - target: $.paths['/api/v3/products/{product_id}/relationships/{relationship_id}/related-products'].get
    description: Migrated 2026-10-20 from the hand-edited openapi.json.
    update:
      description: |-
        List the products linked to one product under a single relationship type.

        > **Warning:** This endpoint returns an empty `data` array even when the relationship has live links. Use [Search-Related-Products](/reference/v3/related-products/search-related-products) with `?product_id=<id>` instead.

        Both path segments take Plytix IDs: `product_id` is the product's `id`, not its SKU, and `relationship_id` is the ID of the relationship type, from [Search-Relationships](/reference/v3/relationships/search-relationships). To see which relationship types a product takes part in, use [Get-Product-Relationships Collection](/reference/v3/product-relationships/get_product_relationships_collection_api_v3_products__product_id__relationships_get).
    x-review: 'On hold (visibility.yaml): live behavior contradicts the spec (FB-024, 2026-10-15: POST 405, PATCH 422, collection GET 404; Q#63/Q#112: nested related-products GETs empty or 404, REL-1 "fix in progress"). This text is from before Phase 2: rewrite it when the operation is restored.'
  - target: $.paths['/api/v3/related-products'].get
    description: Q#112 (scoped; account_id rejected; relationship_id filter returns 200), Q#113, Get Related Products (Top-Level).bru (2026-09-15/22)
    update:
      summary: Search related products
      operationId: search-related-products
      description: |-
        Returns the product-to-product links in your account, one page at a time. Each record links one `product_id` to one `related_product_id`, with the link's `quantity`.

        To get every product related to one product, filter by `product_id`. This is how to read a product's related products: a product's own `product_relationships` field lists only the relationship types it uses.

        Related pages:

        - [Filtering and search](/reference/v3/filtering-and-search)
        - [Pagination](/reference/v3/pagination)
  - target: $.paths['/api/v3/related-products'].get.responses['200'].content['application/json']
    description: Get Related Products (Top-Level).bru "Full Parameters" (2026-09-22), sanitized
    update:
      examples:
        byProduct:
          summary: One product's related products
          description: "`GET /api/v3/related-products?product_id=6a1f0c2e9b3d4a5f8c7e1a01&_fields=product_id&_fields=related_product_id&_fields=quantity`"
          value:
            data:
              - product_id: 6a1f0c2e9b3d4a5f8c7e1a01
                related_product_id: 6a1f0c2e9b3d4a5f8c7e1a21
                quantity: 1
              - product_id: 6a1f0c2e9b3d4a5f8c7e1a01
                related_product_id: 6a1f0c2e9b3d4a5f8c7e1a22
                quantity: 2
            errors: []
            pagination: {}

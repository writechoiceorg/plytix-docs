# Which upstream V3 operations are published. Read by scripts/api/build.mjs (npm run api:build).
#
# Seeded on 2026-10-20 from materials/api-references/endpoint-reviews/
# "Plytix API v3 - endpoint visibility.xlsx" (Plytix's decision column). From now
# on this file is the source of truth: when Plytix changes a decision, update it here.
#
# Values: public | internal | removed | pending | on-hold
#   Only `public` operations reach the docs. `pending` means the operation is new
#   in the spec and Plytix hasn't classified it yet (roadmap.md, "classify the 16
#   operations missing from the sheet"); it stays out of the docs until it is.
#   `on-hold` means the operation is public but its live behavior currently
#   contradicts the spec, so it stays out of the docs until Plytix confirms the
#   contract (see fumadocs/overlays/VERIFY.md). Overlay edits for it are kept
#   but not applied; set it back to `public` to restore the page.
#   Operations missing from this file are excluded too, and the build reports them.
#
# 2026-10-22 (Plytix field-audit handoff, 16 Oct 2026): the dedicated product-category
# and attribute-group link routes are public; the product channel, e-catalog and
# PDF catalog link routes are internal; GET /api/v3/product-relationships is on hold
# (published schema doesn't match the live shape, FB-024).
